<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#7b5cff">
<title>花密 · Flower Password</title>
<!-- 零请求硬保证：禁止一切网络访问，只允许内联样式/脚本和 data: 图片 -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:; font-src data:; connect-src 'none'; base-uri 'none'; form-action 'none'">
<link rel="icon" href="data:,">
<style>
:root{
  --ink:#252b46; --muted:#8b93b0; --line:#eef0f8;
  --violet:#7b5cff; --pink:#ff5fa2; --cyan:#22d3ee; --green:#10c98a;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  min-height:100vh; min-height:100dvh; padding:32px 18px calc(32px + env(safe-area-inset-bottom));
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Segoe UI",sans-serif;
  color:var(--ink); background:linear-gradient(140deg,#7b5cff 0%,#9d6cff 42%,#ff6fae 100%);
  display:flex; align-items:flex-start; justify-content:center; overflow-x:hidden;
}
/* 两团缓慢游走的光斑，纯 CSS，无图片请求 */
body::before,body::after{content:"";position:fixed;border-radius:50%;filter:blur(2px);pointer-events:none;z-index:0}
body::before{width:340px;height:340px;top:-120px;left:-110px;background:radial-gradient(circle,rgba(255,255,255,.38),transparent 68%);animation:float1 14s ease-in-out infinite}
body::after{width:300px;height:300px;bottom:-130px;right:-90px;background:radial-gradient(circle,rgba(34,211,238,.45),transparent 68%);animation:float2 18s ease-in-out infinite}
@keyframes float1{50%{transform:translate(70px,60px)}}
@keyframes float2{50%{transform:translate(-60px,-50px)}}

.wrap{position:relative;z-index:1;width:100%;max-width:420px}

/* 头部 */
header{text-align:center;color:#fff;margin-bottom:26px;animation:rise .5s ease both}
.brand{display:inline-flex;align-items:baseline;gap:10px}
.brand .flower{font-size:34px;filter:drop-shadow(0 4px 10px rgba(0,0,0,.15));animation:sway 4s ease-in-out infinite}
.brand h1{font-size:44px;font-weight:800;letter-spacing:3px;text-shadow:0 4px 18px rgba(80,30,140,.25)}
@keyframes sway{50%{transform:rotate(-14deg) scale(1.08)}}
.subtitle{margin-top:2px;font-size:12px;letter-spacing:3.5px;text-transform:uppercase;opacity:.82}

/* 主卡片 */
.card{
  background:rgba(255,255,255,.94); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
  border:1px solid rgba(255,255,255,.7); border-radius:24px;
  padding:26px 22px 22px; box-shadow:0 22px 50px rgba(58,28,120,.28);
  animation:rise .55s .08s ease both;
}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin:0 0 8px 4px;letter-spacing:.5px}
.field{position:relative;margin-bottom:18px}
.field input{
  width:100%;height:52px;padding:0 16px;font-size:16px;color:var(--ink);
  background:#f6f7fc;border:2px solid transparent;border-radius:14px;outline:none;
  font-family:inherit;transition:border-color .2s,box-shadow .2s,background .2s;
}
.field input::placeholder{color:#b6bcd0}
.field input:focus{background:#fff;border-color:var(--violet);box-shadow:0 0 0 4px rgba(123,92,255,.14)}
.field input[type=password]{letter-spacing:2px}

.divider{height:1px;background:var(--line);margin:22px 0 20px}

/* 结果行 */
.result{
  display:flex;align-items:center;gap:10px;padding:12px 12px 12px 16px;margin-bottom:12px;
  background:linear-gradient(100deg,#f7f6ff,#fdf2f8);border:1px solid #f0eefb;border-radius:15px;
  animation:rise .5s both; transition:transform .18s,box-shadow .18s;
}
.result:nth-of-type(1){animation-delay:.16s}
.result:nth-of-type(2){animation-delay:.22s}
.result:nth-of-type(3){animation-delay:.28s}
.result:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(123,92,255,.13)}
.result .len{font-size:11px;font-weight:700;color:#a29ab8;white-space:nowrap;width:30px}
.result .code{
  flex:1;min-width:0;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  font-size:15px;font-weight:600;letter-spacing:1px;color:var(--ink);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;user-select:all;
}
.result .code.pending{color:#c2c7d8;letter-spacing:3px}
.copy{
  flex:none;height:36px;min-width:62px;padding:0 12px;border:0;border-radius:10px;cursor:pointer;
  color:#fff;font-size:13px;font-weight:700;font-family:inherit;
  background:linear-gradient(135deg,var(--violet),var(--pink));
  box-shadow:0 4px 12px rgba(123,92,255,.28);transition:transform .12s,background .2s,box-shadow .2s;
}
.copy:hover{transform:translateY(-1px);box-shadow:0 6px 16px rgba(123,92,255,.36)}
.copy:active{transform:scale(.95)}
.copy.done{background:var(--green);box-shadow:0 4px 12px rgba(16,201,138,.3)}

footer{text-align:center;margin-top:18px;font-size:11px;color:rgba(255,255,255,.86);letter-spacing:.4px}
footer .dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:#8affc1;margin-right:6px;box-shadow:0 0 8px #8affc1}
@media (max-width:360px){.brand h1{font-size:38px}.card{padding:22px 16px}.result{padding-left:12px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand"><span class="flower">🌸</span><h1>花密</h1></div>
    <div class="subtitle">Flower Password</div>
  </header>

  <main class="card">
    <div class="field">
      <label for="password">记忆密码</label>
      <input id="password" type="password" placeholder="只记在脑子里的主密码" autocomplete="off" spellcheck="false">
    </div>
    <div class="field">
      <label for="key">区分代号</label>
      <input id="key" type="text" placeholder="如网站名 / 用途" autocomplete="off" spellcheck="false">
    </div>

    <div class="divider"></div>

    <div class="result"><span class="len">8 位</span><span class="code pending" id="code8">—</span><button class="copy" data-for="code8">复制</button></div>
    <div class="result"><span class="len">16 位</span><span class="code pending" id="code16">—</span><button class="copy" data-for="code16">复制</button></div>
    <div class="result"><span class="len">32 位</span><span class="code pending" id="code32">—</span><button class="copy" data-for="code32">复制</button></div>
  </main>

  <footer><span class="dot"></span>本地计算 · 全程无网络请求</footer>
</div>

<script>
/* ===== MD5 / HMAC-MD5：与花密原版逐行等价的纯 JS 实现（去掉 jQuery 外壳）===== */
const md5 = (function () {
  'use strict';
  function safe_add(x, y) {
    const lsw = (x & 0xFFFF) + (y & 0xFFFF);
    const msw = (x >> 16) + (y >> 16) + (lsw >> 16);
    return (msw << 16) | (lsw & 0xFFFF);
  }
  function bit_rol(num, cnt) { return (num << cnt) | (num >>> (32 - cnt)); }
  function md5_cmn(q, a, b, x, s, t) { return safe_add(bit_rol(safe_add(safe_add(a, q), safe_add(x, t)), s), b); }
  function md5_ff(a, b, c, d, x, s, t) { return md5_cmn((b & c) | ((~b) & d), a, b, x, s, t); }
  function md5_gg(a, b, c, d, x, s, t) { return md5_cmn((b & d) | (c & (~d)), a, b, x, s, t); }
  function md5_hh(a, b, c, d, x, s, t) { return md5_cmn(b ^ c ^ d, a, b, x, s, t); }
  function md5_ii(a, b, c, d, x, s, t) { return md5_cmn(c ^ (b | (~d)), a, b, x, s, t); }

  function binl_md5(x, len) {
    x[len >> 5] |= 0x80 << (len % 32);
    x[(((len + 64) >>> 9) << 4) + 14] = len;
    let i, olda, oldb, oldc, oldd;
    let a = 1732584193, b = -271733879, c = -1732584194, d = 271733878;
    for (i = 0; i < x.length; i += 16) {
      olda = a; oldb = b; oldc = c; oldd = d;
      a = md5_ff(a, b, c, d, x[i], 7, -680876936);
      d = md5_ff(d, a, b, c, x[i + 1], 12, -389564586);
      c = md5_ff(c, d, a, b, x[i + 2], 17, 606105819);
      b = md5_ff(b, c, d, a, x[i + 3], 22, -1044525330);
      a = md5_ff(a, b, c, d, x[i + 4], 7, -176418897);
      d = md5_ff(d, a, b, c, x[i + 5], 12, 1200080426);
      c = md5_ff(c, d, a, b, x[i + 6], 17, -1473231341);
      b = md5_ff(b, c, d, a, x[i + 7], 22, -45705983);
      a = md5_ff(a, b, c, d, x[i + 8], 7, 1770035416);
      d = md5_ff(d, a, b, c, x[i + 9], 12, -1958414417);
      c = md5_ff(c, d, a, b, x[i + 10], 17, -42063);
      b = md5_ff(b, c, d, a, x[i + 11], 22, -1990404162);
      a = md5_ff(a, b, c, d, x[i + 12], 7, 1804603682);
      d = md5_ff(d, a, b, c, x[i + 13], 12, -40341101);
      c = md5_ff(c, d, a, b, x[i + 14], 17, -1502002290);
      b = md5_ff(b, c, d, a, x[i + 15], 22, 1236535329);
      a = md5_gg(a, b, c, d, x[i + 1], 5, -165796510);
      d = md5_gg(d, a, b, c, x[i + 6], 9, -1069501632);
      c = md5_gg(c, d, a, b, x[i + 11], 14, 643717713);
      b = md5_gg(b, c, d, a, x[i], 20, -373897302);
      a = md5_gg(a, b, c, d, x[i + 5], 5, -701558691);
      d = md5_gg(d, a, b, c, x[i + 10], 9, 38016083);
      c = md5_gg(c, d, a, b, x[i + 15], 14, -660478335);
      b = md5_gg(b, c, d, a, x[i + 4], 20, -405537848);
      a = md5_gg(a, b, c, d, x[i + 9], 5, 568446438);
      d = md5_gg(d, a, b, c, x[i + 14], 9, -1019803690);
      c = md5_gg(c, d, a, b, x[i + 3], 14, -187363961);
      b = md5_gg(b, c, d, a, x[i + 8], 20, 1163531501);
      a = md5_gg(a, b, c, d, x[i + 13], 5, -1444681467);
      d = md5_gg(d, a, b, c, x[i + 2], 9, -51403784);
      c = md5_gg(c, d, a, b, x[i + 7], 14, 1735328473);
      b = md5_gg(b, c, d, a, x[i + 12], 20, -1926607734);
      a = md5_hh(a, b, c, d, x[i + 5], 4, -378558);
      d = md5_hh(d, a, b, c, x[i + 8], 11, -2022574463);
      c = md5_hh(c, d, a, b, x[i + 11], 16, 1839030562);
      b = md5_hh(b, c, d, a, x[i + 14], 23, -35309556);
      a = md5_hh(a, b, c, d, x[i + 1], 4, -1530992060);
      d = md5_hh(d, a, b, c, x[i + 4], 11, 1272893353);
      c = md5_hh(c, d, a, b, x[i + 7], 16, -155497632);
      b = md5_hh(b, c, d, a, x[i + 10], 23, -1094730640);
      a = md5_hh(a, b, c, d, x[i + 13], 4, 681279174);
      d = md5_hh(d, a, b, c, x[i], 11, -358537222);
      c = md5_hh(c, d, a, b, x[i + 3], 16, -722521979);
      b = md5_hh(b, c, d, a, x[i + 6], 23, 76029189);
      a = md5_hh(a, b, c, d, x[i + 9], 4, -640364487);
      d = md5_hh(d, a, b, c, x[i + 12], 11, -421815835);
      c = md5_hh(c, d, a, b, x[i + 15], 16, 530742520);
      b = md5_hh(b, c, d, a, x[i + 2], 23, -995338651);
      a = md5_ii(a, b, c, d, x[i], 6, -198630844);
      d = md5_ii(d, a, b, c, x[i + 7], 10, 1126891415);
      c = md5_ii(c, d, a, b, x[i + 14], 15, -1416354905);
      b = md5_ii(b, c, d, a, x[i + 5], 21, -57434055);
      a = md5_ii(a, b, c, d, x[i + 12], 6, 1700485571);
      d = md5_ii(d, a, b, c, x[i + 3], 10, -1894986606);
      c = md5_ii(c, d, a, b, x[i + 10], 15, -1051523);
      b = md5_ii(b, c, d, a, x[i + 1], 21, -2054922799);
      a = md5_ii(a, b, c, d, x[i + 8], 6, 1873313359);
      d = md5_ii(d, a, b, c, x[i + 15], 10, -30611744);
      c = md5_ii(c, d, a, b, x[i + 6], 15, -1560198380);
      b = md5_ii(b, c, d, a, x[i + 13], 21, 1309151649);
      a = md5_ii(a, b, c, d, x[i + 4], 6, -145523070);
      d = md5_ii(d, a, b, c, x[i + 11], 10, -1120210379);
      c = md5_ii(c, d, a, b, x[i + 2], 15, 718787259);
      b = md5_ii(b, c, d, a, x[i + 9], 21, -343485551);
      a = safe_add(a, olda); b = safe_add(b, oldb);
      c = safe_add(c, oldc); d = safe_add(d, oldd);
    }
    return [a, b, c, d];
  }
  function binl2rstr(input) {
    let out = '';
    for (let i = 0; i < input.length * 32; i += 8) out += String.fromCharCode((input[i >> 5] >>> (i % 32)) & 0xFF);
    return out;
  }
  function rstr2binl(input) {
    const out = [];
    out[(input.length >> 2) - 1] = undefined;
    for (let i = 0; i < out.length; i++) out[i] = 0;
    for (let i = 0; i < input.length * 8; i += 8) out[i >> 5] |= (input.charCodeAt(i / 8) & 0xFF) << (i % 32);
    return out;
  }
  function rstr_md5(s) { return binl2rstr(binl_md5(rstr2binl(s), s.length * 8)); }
  function rstr_hmac_md5(key, data) {
    let bkey = rstr2binl(key);
    const ipad = [], opad = [];
    if (bkey.length > 16) bkey = binl_md5(bkey, key.length * 8);
    for (let i = 0; i < 16; i++) { ipad[i] = bkey[i] ^ 0x36363636; opad[i] = bkey[i] ^ 0x5C5C5C5C; }
    const hash = binl_md5(ipad.concat(rstr2binl(data)), 512 + data.length * 8);
    return binl2rstr(binl_md5(opad.concat(hash), 512 + 128));
  }
  function rstr2hex(input) {
    const hex = '0123456789abcdef';
    let out = '';
    for (let i = 0; i < input.length; i++) {
      const x = input.charCodeAt(i);
      out += hex.charAt((x >>> 4) & 0x0F) + hex.charAt(x & 0x0F);
    }
    return out;
  }
  // 与原版一致：用 encodeURIComponent + unescape 做 UTF-8 字节展开（保证中文/emoji 结果不变）
  function str2rstr_utf8(input) { return unescape(encodeURIComponent(input)); }
  function raw_md5(s) { return rstr_md5(str2rstr_utf8(s)); }
  function hex_md5(s) { return rstr2hex(raw_md5(s)); }
  function raw_hmac_md5(k, d) { return rstr_hmac_md5(str2rstr_utf8(k), str2rstr_utf8(d)); }
  function hex_hmac_md5(k, d) { return rstr2hex(raw_hmac_md5(k, d)); }

  return function (string, key, raw) {
    if (!key) return raw ? raw_md5(string) : hex_md5(string);
    return raw ? raw_hmac_md5(key, string) : hex_hmac_md5(key, string);
  };
})();

/* ===== 花密核心计算：与原版 countCode 逻辑一致（含首字母大写特例）===== */
const RULE = 'sunlovesnow1990090127xykab';
function countCode() {
  const password = document.getElementById('password').value;
  const key = document.getElementById('key').value;
  const e8 = document.getElementById('code8');
  const e16 = document.getElementById('code16');
  const e32 = document.getElementById('code32');

  if (!(password && key)) {
    [e8, e16, e32].forEach(function (el) { el.textContent = '—'; el.classList.add('pending'); });
    return null;
  }

  const md5one = md5(password, key);
  const md5two = md5(md5one, 'snow');
  const md5three = md5(md5one, 'kise');

  const rule = md5three.split('');
  const source = md5two.split('');
  for (let i = 0; i <= 31; i++) {
    if (isNaN(source[i]) && RULE.search(rule[i]) > -1) source[i] = source[i].toUpperCase();
  }

  const code32 = source.join('');
  // 首字符为数字时用 K 打头，确保满足"必须含大写字母"的站点要求
  const code16 = isNaN(code32.slice(0, 1)) ? code32.slice(0, 16) : 'K' + code32.slice(1, 16);
  const code8 = code16.slice(0, 8);

  [[e8, code8], [e16, code16], [e32, code32]].forEach(function (pair) {
    pair[0].textContent = pair[1];
    pair[0].classList.remove('pending');
  });
  return { code8: code8, code16: code16, code32: code32 };
}

/* ===== 事件与复制 ===== */
document.getElementById('password').addEventListener('input', countCode);
document.getElementById('key').addEventListener('input', countCode);

const timers = new WeakMap();
async function copyText(text, btn) {
  let ok = false;
  try {
    if (navigator.clipboard && window.isSecureContext) {
      await navigator.clipboard.writeText(text);
      ok = true;
    } else {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.setAttribute('readonly', '');
      ta.style.cssText = 'position:fixed;top:-9999px;opacity:0';
      document.body.appendChild(ta);
      ta.select();
      ok = document.execCommand('copy');
      ta.remove();
    }
  } catch (e) { ok = false; }
  clearTimeout(timers.get(btn));
  btn.textContent = ok ? '已复制 ✓' : '复制失败';
  btn.classList.toggle('done', ok);
  timers.set(btn, setTimeout(function () {
    btn.textContent = '复制';
    btn.classList.remove('done');
  }, 1300));
}
document.querySelectorAll('.copy').forEach(function (btn) {
  btn.addEventListener('click', function () {
    const text = document.getElementById(btn.dataset.for).textContent;
    if (text && text !== '—') copyText(text, btn);
  });
});
// 便于自测与验证：暴露纯计算函数
window.countCode = countCode;
window.__fp_md5 = md5;
</script>
</body>
