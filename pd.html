/* ===================== 批量初始化 ===================== */
function openBulkInit(){
  if (!S.dias.length){ alert('还没有任何库存，先录入一次再来'); return; }

  const st = { dia: S.dias[0], fam:'all', qty:1000, scope:'stocked' };

  const codesOf = () => COLORS
    .filter(c => st.fam === 'all' || c.family === st.fam)
    .filter(c => st.scope === 'all' || (stockAt(c.code, st.dia) && qtyAt(c.code, st.dia) > 0))
    .map(c => c.code);

  function form(){
    const codes = codesOf();
    const famCount = f => COLORS.filter(c => f === 'all' || c.family === f).length;
    const stockedAll = COLORS.filter(c => stockAt(c.code, st.dia) && qtyAt(c.code, st.dia) > 0).length;

    sheet(`
      <div class="sh">
        <h3>批量初始化数量</h3>
        <p>把一批色号统一设成同一个颗数。用在刚买整套、或者刚盘完一整盒的时候。</p>
      </div>
      <div class="sb">
        <div class="lbl">直径</div>
        <div class="dias" id="bi-dias" style="justify-content:flex-start">
          ${S.dias.map(d => `<button type="button" class="dia${Number(d) === Number(st.dia) ? ' on' : ''}"
              data-d="${d}">${String(d).replace(/\.0$/,'')}<em>mm</em></button>`).join('')}
        </div>

        <div class="lbl">系列</div>
        <div class="dias" id="bi-fams" style="flex-wrap:wrap">
          <button type="button" class="dia${st.fam === 'all' ? ' on' : ''}" data-f="all"
            style="flex:1 1 30%">全部<em>${famCount('all')}</em></button>
          ${FAMILIES.map(f => `<button type="button" class="dia${st.fam === f ? ' on' : ''}" data-f="${f}"
            style="flex:1 1 30%">${f}<em>${famCount(f)}</em></button>`).join('')}
        </div>

        <div class="lbl">每个色号设为</div>
        <div class="numfield" id="bi-qty">
          <span class="v" id="bi-qv">${intFmt(st.qty)}</span><span class="u">颗</span>
        </div>

        <div class="lbl">范围</div>
        <div class="seg" id="bi-scope">
          <button type="button" data-s="stocked"${st.scope === 'stocked' ? ' class="on"' : ''}
            ${stockedAll ? '' : 'disabled'}>已有记录（${stockedAll}）</button>
          <button type="button" data-s="all"${st.scope === 'all' ? ' class="on"' : ''}>
            全部 ${famCount(st.fam)} 色</button>
        </div>

        <div class="prev" style="background:var(--warn-soft);color:var(--warn)">
          会把选中的 <b>${codes.length}</b> 个色号在
          <b>${String(st.dia).replace(/\.0$/,'')}mm</b> 下的数量全部改成 <b>${intFmt(st.qty)}</b> 颗，
          原来的颗数被覆盖，不会自动备份。
        </div>
      </div>
      <div class="acts">
        <button class="btn" id="bi-cancel">取消</button>
        <button class="btn pri" id="bi-next">下一步</button>
      </div>
    `);

    $('bi-dias').querySelectorAll('.dia').forEach(b => {
      b.onclick = () => { st.dia = Number(b.dataset.d); if (!stockedAll) st.scope = 'all'; form(); };
    });
    $('bi-fams').querySelectorAll('.dia').forEach(b => {
      b.onclick = () => { st.fam = b.dataset.f; form(); };
    });
    $('bi-qty').onclick = () => numPad({
      title: '每个色号设成多少颗', unit: '颗', decimal: false, value: st.qty,
      onOk: v => { st.qty = Math.round(v); form(); }
    });
    $('bi-scope').querySelectorAll('button').forEach(b => {
      b.onclick = () => { if (b.disabled) return; st.scope = b.dataset.s; form(); };
    });
    $('bi-cancel').onclick = closeSheet;
    $('bi-next').onclick = () => { if (st.qty > 0) confirmStep(); };
  }

  function confirmStep(){
    const codes = codesOf();
    if (!codes.length) return alert('这个范围内没有色号');

    sheet(`
      <div class="sh">
        <h3 style="color:var(--danger)">确认初始化？</h3>
        <p>这一步会直接改写库存，没有撤销按钮。</p>
      </div>
      <div class="sb">
        <div class="prev" style="background:#fdecea;color:#8f241a;margin-top:0">
          <div style="font-size:13px;line-height:1.9;color:var(--text)">
            直径　<b>${String(st.dia).replace(/\.0$/,'')}mm</b><br>
            系列　<b>${st.fam === 'all' ? '全部系列' : st.fam}</b><br>
            数量　<b>${intFmt(st.qty)} 颗</b> / 色号<br>
            范围　<b>${codes.length} 个色号</b>${st.scope === 'all' ? '（含还没有记录的）' : ''}
          </div>
          <hr>
          覆盖后这些色号原来的数量都没了，只在日志里留一条汇总。
        </div>
        <div style="font-size:11.5px;color:var(--muted);padding:10px 2px 0;line-height:1.7">
          点错了就点下面的「返回」，什么都还没改。
        </div>
      </div>
      <div class="acts">
        <button class="btn" id="bi-back">返回</button>
        <button class="btn dgr" id="bi-go">确认初始化</button>
      </div>
    `);

    $('bi-back').onclick = form;
    $('bi-go').onclick = () => doBulkInit(codes, st.qty, st.dia);
  }

  function doBulkInit(codes, qty, dia){
    const gpb = recentGpb(dia);
    codes.forEach(code => writeRow(code, dia, qty, gpb));
    logIt(null, null, 'BULK_INIT',
      `初始化 ${String(dia).replace(/\.0$/,'')}mm · ${st.fam === 'all' ? '全部系列' : st.fam}：${codes.length} 个色号都设为 ${intFmt(qty)} 颗`);
    save();
    closeSheet();
    refreshAll();
    pickedCode = null;
    renderSort();
  }

  form();
}

/* ===================== 点选式色号定位 ===================== */
const DIGITS = ['1','2','3','4','5','6','7','8','9','0'];

/**
 * 点选色号。不传参数＝选完跳转到色号详情；
 * 传 { onPick, sub, title, okText, onOk } 时用于批量/连续录入，选完不关面板。
 */
function openPicker(opt){
  opt = opt || {};
  const st = { fam:null, d1:null, d2:null };
  let editing = 0;                      // 当前展开的是第几位，null 表示全部收起

  sheet(`
    <div class="sh">
      <h3>${opt.title || '定位色号'}</h3>
      <p id="pk-sub">${opt.sub || '选完一位自动收起。想改就点上面那一格，再展开重选。'}</p>
    </div>
    <div class="sb">
      <div class="slots" id="pk-slots"></div>
      <div id="pk-stage"><div class="picks" id="pk-grid"></div></div>
      <div class="prev" id="pk-out" style="margin-top:11px">先点一个系列</div>
      <div id="pk-match" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:6px"></div>
    </div>
    <div class="acts">
      <button class="btn" id="pk-cancel">取消</button>
      <button class="btn pri" id="pk-ok">${opt.okText || '确定'}</button>
    </div>
  `);

  const cntOf = p => p ? COLORS.filter(c => c.code.startsWith(p)).length : 0;
  const prefix = () => (st.fam || '') + (st.d1 || '') + (st.d2 || '');
  const matched = () => { const p = prefix(); return p ? COLORS.filter(c => c.code.startsWith(p)) : []; };

  function paint(){
    /* 位槽：已选的值直接摊在顶部，像计算器显示屏 */
    $('pk-slots').innerHTML = [
      { i:0, lab:'系列', v:st.fam },
      { i:1, lab:'数字', v:st.d1 },
      { i:2, lab:'数字', v:st.d2 }
    ].map(s => {
      const locked = (s.i === 1 && !st.fam) || (s.i === 2 && !st.d1);
      return `<button type="button" class="slot${editing === s.i ? ' on' : ''}${s.v ? '' : ' blank'}"
                data-slot="${s.i}"${locked ? ' disabled' : ''}>
                <em>${s.lab}</em><b>${s.v || '—'}</b></button>`;
    }).join('');

    /* 只渲染当前展开的那一位，其它都收起 */
    const g = $('pk-grid');
    g.className = 'picks' + (editing === 0 || editing === null ? '' : ' nums');
    // 展开区高度跟着内容走：系列一行 46，数字两行 98，全收起时只留一行提示
    $('pk-stage').style.minHeight = editing === 0 ? '46px' : (editing === 1 || editing === 2) ? '98px' : '30px';
    if (editing === 0){
      g.innerHTML = FAMILIES.map(f => {
        const has = COLORS.filter(c => c.family === f && agg(c.code).count > 0).length;
        return `<button type="button" class="pick sm${st.fam === f ? ' on' : ''}" data-v="${f}">
                  ${f}<em>${has || '·'}</em></button>`;
      }).join('');
    } else if (editing === 1){
      g.innerHTML = DIGITS.map(k => {
        const n = cntOf(st.fam + k);
        return `<button type="button" class="pick${st.d1 === k ? ' on' : ''}" data-v="${k}"
                  ${n ? '' : 'disabled'}>${k}<em>${n || ''}</em></button>`;
      }).join('');
    } else if (editing === 2){
      const p2 = st.fam + st.d1;
      g.innerHTML = DIGITS.map(k => {
        const n = cntOf(p2 + k);
        return `<button type="button" class="pick${st.d2 === k ? ' on' : ''}" data-v="${k}"
                  ${n ? '' : 'disabled'}>${k}<em>${n || ''}</em></button>`;
      }).join('');
    } else {
      g.innerHTML = `<div style="font-size:12px;color:var(--faint);line-height:1.7">
        点上面任意一格继续选。三格都填好就不用再点了。</div>`;
    }

    /* 实时匹配 */
    const list = matched(), exact = BY_CODE[prefix()], box = $('pk-match');
    if (!st.fam){
      box.innerHTML = '';
      $('pk-out').innerHTML = '先点一个系列';
    } else if (!list.length){
      box.innerHTML = '';
      $('pk-out').innerHTML = `<span class="w">${prefix()} 不存在，换个数字</span>`;
    } else {
      box.innerHTML = list.map(c => {
        const hx = hexOf(c.code), a = agg(c.code);
        return `<button type="button" class="bead${a.count > 0 ? ' hasq' : ''}" data-code="${c.code}"
                  style="background:${hx};${textStyle(hx)}">
                  ${c.code}${a.count > 0
                    ? `<span class="qty">${a.count > 0 ? intFmt(a.count) : '—'}</span>` : ''}
                </button>`;
      }).join('');
      box.querySelectorAll('.bead').forEach(b => {
        b.onclick = () => go(b.dataset.code);
      });

      if (exact) $('pk-out').innerHTML = `就是 <b>${exact.code}</b>，点确定打开`;
      else if (list.length === 1) $('pk-out').innerHTML = `只有一个 <b>${list[0].code}</b>，点确定打开`;
      else $('pk-out').innerHTML = `<b>${prefix()}</b> 开头有 ${list.length} 个，接着点，或直接点下面的色块`;
    }

    /* 位槽点击：展开 / 收起 */
    $('pk-slots').querySelectorAll('.slot').forEach(b => {
      b.onclick = () => {
        const i = +b.dataset.slot;
        editing = (editing === i) ? null : i;
        paint();
      };
    });

    /* 选项点击：填值 → 收起这一位 → 自动展开下一位 */
    g.querySelectorAll('.pick').forEach(b => {
      b.onclick = () => {
        const v = b.dataset.v;
        if (editing === 0){
          if (st.fam === v){ st.fam = null; st.d1 = null; st.d2 = null; editing = 0; }
          else { st.fam = v; st.d1 = null; st.d2 = null; editing = 1; }
        } else if (editing === 1){
          if (st.d1 === v){ st.d1 = null; st.d2 = null; editing = 1; }
          else {
            st.d1 = v; st.d2 = null;
            // 前缀已经唯一确定色号的话，就不用再点第三位了
            const p = st.fam + st.d1;
            editing = (BY_CODE[p] && cntOf(p) === 1) ? null : 2;
          }
        } else if (editing === 2){
          if (st.d2 === v){ st.d2 = null; editing = 2; }
          else { st.d2 = v; editing = null; }
        }
        paint();
      };
    });
  }

  function go(code){
    if (opt.onPick){
      // 连续录入模式：不关面板，选完清掉后两位，同系列可以接着点下一个
      opt.onPick(code, {
        setSub: t => { const e = $('pk-sub'); if (e) e.textContent = t; },
        close: closeSheet
      });
      st.d1 = null; st.d2 = null; editing = 1; paint();
      return;
    }
    pickedCode = code;
    closeSheet();
    curCode = code;
    setTimeout(openColor, 180);
  }

  $('pk-cancel').onclick = closeSheet;
  $('pk-ok').onclick = () => {
    if (opt.onOk){ opt.onOk(); return; }
    const exact = BY_CODE[prefix()], list = matched();
    if (exact) return go(exact.code);
    if (list.length === 1) return go(list[0].code);
    const box = $('pk-match');
    box.animate?.(
      [{ transform:'translateX(0)' }, { transform:'translateX(-5px)' },
       { transform:'translateX(5px)' }, { transform:'translateX(0)' }],
      { duration: 220 });
    if (!list.length) $('pk-out').innerHTML = `<span class="w">还没选到有效色号</span>`;
    else $('pk-out').innerHTML = `<span class="w">还有 ${list.length} 个，点下面的色块选一个</span>`;
  };

  paint();
}

/* ===================== sheet 控制 ===================== */
function sheet(html){
  const el = $('sheet');
  el.innerHTML = `<div class="handle"></div>` + html;
  el.scrollTop = 0;
  el.classList.add('on');
  $('scrim').classList.add('on');
}
function closeSheet(){
  $('sheet').classList.remove('on');
  $('scrim').classList.remove('on');
}
$('scrim').onclick = closeSheet;

/* ===================== tab 切换 ===================== */
document.querySelectorAll('.tabbar button').forEach(b => {
  b.onclick = () => {
    tab = b.dataset.tab;
    lastBatch = null;              // 切换 tab 也放弃撤销权
    $('p-patd').classList.remove('on');
    document.querySelectorAll('.tabbar button').forEach(x => x.classList.toggle('on', x === b));
    $('p-pat').classList.toggle('on', tab === 'pat');
    $('p-stock').classList.toggle('on', tab === 'stock');
    $('p-brand').classList.toggle('on', tab === 'brand');
    $('p-set').classList.toggle('on', tab === 'set');
    if (tab === 'pat') renderPatterns();
    if (tab === 'stock') renderStock();
    if (tab === 'brand') renderBrands();
    if (tab === 'set') renderSettings();
  };
});

/* ===================== Android 壳的接口 ===================== */
/**
 * 返回键：键盘 → 抽屉 → 推入页，逐层退一层。
 * 返回 true 表示这一下被页面吃掉了，壳就不退出 App。
 */
window.__androidBack = function(){
  const pad = document.querySelector('.padlayer.on');
  if (pad){ pad.remove(); return true; }          // 数字键盘开着，先收键盘

  const sh = document.getElementById('sheet');
  if (sh && sh.classList.contains('on')){ closeSheet(); return true; }

  const push = document.querySelector('.push.on');
  if (push){
    push.classList.remove('on');
    if (push.id === 'p-patd'){ curPat = null; renderPatterns(); }
    return true;
  }
  return false;
};

/** 壳退出/切后台时用它取当前状态落盘 */
