<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>拼豆库存</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  :root {
    --bg: #f6f7f9;
    --card: #ffffff;
    --line: #e8eaed;
    --line2: #f2f3f5;
    --text: #15171a;
    --muted: #6b7280;
    --faint: #9aa1ab;
    --accent: #2f6bff;
    --accent-soft: #eef3ff;
    --warn: #a45a06;
    --warn-soft: #fef3c7;
    --ok: #067a5b;
    --ok-soft: #e6f7f1;
    --danger: #c0271c;
  }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: #e9ebee; color: var(--text);
    font-size: 14px; line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
  }
  button, input { font-family: inherit; color: inherit; }

  /* ---------- 手机容器 ---------- */
  .phone {
    position: relative; width: 100%; max-width: 430px; height: 100dvh;
    background: var(--bg); overflow: hidden;
    display: grid; grid-template-rows: 1fr auto;
  }
  @media (min-width: 560px) and (min-height: 700px) {
    .phone {
      height: min(920px, 94dvh); border-radius: 26px;
      box-shadow: 0 20px 60px rgba(15,20,30,.18), 0 0 0 1px rgba(0,0,0,.06);
    }
  }

  /* ---------- 页面栈 ---------- */
  .pages { position: relative; overflow: hidden; min-height: 0; }
  .page {
    position: absolute; inset: 0; display: none; flex-direction: column;
    background: var(--bg); min-height: 0;
    /* 三重保险：任何一个失效都不会让别的页面露出来 */
    visibility: hidden; opacity: 0;
  }
  .page.on { display: flex; visibility: visible; opacity: 1; }

  /* 推入页（全屏覆盖，含 tabbar 区域） */
  .push {
    position: absolute; inset: 0; background: var(--bg); z-index: 30;
    display: flex; flex-direction: column;
    transform: translateX(100%); transition: transform .26s cubic-bezier(.32,.72,0,1);
    pointer-events: none;
  }
  .push.on { transform: translateX(0); pointer-events: auto; }

  /* ---------- 页面头 ---------- */
  .ph { background: var(--bg); padding: 6px 16px 10px; flex: 0 0 auto; }
  .ph.big { padding-top: max(14px, env(safe-area-inset-top)); }
  .ph-row { display: flex; align-items: baseline; gap: 9px; margin-bottom: 3px; }
  .ph h1 { font-size: 25px; font-weight: 700; letter-spacing: -.4px; }
  .ph .sub { font-size: 11.5px; color: var(--faint); }
  .ph .act {
    margin-left: auto; border: 0; background: transparent; font-size: 13.5px;
    color: var(--accent); padding: 4px; cursor: pointer; align-self: center;
  }

  .nav {
    display: flex; align-items: center; gap: 9px; flex: 0 0 auto;
    height: calc(46px + env(safe-area-inset-top));
    padding: env(safe-area-inset-top) 6px 0 2px;
    background: var(--card); border-bottom: 1px solid var(--line);
  }
  .nav button.back {
    border: 0; background: transparent; font-size: 21px; color: var(--accent);
    width: 40px; height: 40px; cursor: pointer; display: flex;
    align-items: center; justify-content: center; padding-bottom: 2px;
  }
  .nav .title { flex: 1; font-size: 16px; font-weight: 600; }
  .nav .r { border: 0; background: transparent; font-size: 13.5px; color: var(--accent);
            padding: 6px 10px; cursor: pointer; }

  /* ---------- 滚动区 ---------- */
  .body { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch;
          padding: 0 16px 24px; min-height: 0; }

  /* ---------- 搜索行（点选式，不调键盘） ---------- */
  .srow { display: flex; gap: 8px; align-items: center; }
  .sbtn {
    flex: 1; min-width: 0; display: flex; align-items: center; gap: 8px;
    border: 0; background: #eceef1; border-radius: 10px; padding: 8px 12px;
    height: 38px; font-size: 13.5px; color: var(--faint); cursor: pointer;
    text-align: left;
  }
  .sbtn .ico { font-size: 13px; flex: 0 0 auto; }
  .sbtn .v { color: var(--text); font-weight: 600; font-variant-numeric: tabular-nums;
             letter-spacing: .3px; }
  .sbtn .chev { margin-left: auto; font-size: 15px; color: #c9ced6; flex: 0 0 auto; }
  .sortbtn {
    width: 38px; height: 38px; flex: 0 0 auto; border: 0; border-radius: 10px;
    background: #eceef1; color: var(--muted); cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: background .15s, color .15s;
  }
  .sortbtn.on { background: var(--accent-soft); color: var(--accent); }

  /* ---------- 点选网格 ---------- */
  .picks { display: flex; flex-wrap: wrap; gap: 6px; }
  .picks.nums { display: grid; grid-template-columns: repeat(5, 1fr); }
  .picks.nums .pick { width: auto; }
  .picks.lock { opacity: .32; pointer-events: none; }
  .pick {
    width: 46px; height: 46px; border: 1.5px solid var(--line); background: var(--card);
    border-radius: 10px; font-size: 16px; font-weight: 600; cursor: pointer; padding: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    font-variant-numeric: tabular-nums; color: var(--text); flex: 0 0 auto;
  }
  .pick em { font-style: normal; font-size: 9px; font-weight: 400; color: var(--faint);
             line-height: 1.2; }
  .pick.on { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }
  .pick.on em { color: var(--accent); opacity: .85; }
  .pick:disabled { opacity: .26; }
  .pick.sm { width: 38px; height: 42px; font-size: 14.5px; }

  /* ---------- 色号定位的位槽（计算器式） ---------- */
  .slots { display: flex; gap: 8px; margin-bottom: 10px; align-items: flex-start; }
  .slot {
    flex: 1; min-width: 0; border: 1.5px solid var(--line);
    border-radius: 12px; background: #fff; cursor: pointer;
    padding: 8px 4px 9px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 2px;
  }
  .slot em { font-style: normal; font-size: 10px; color: var(--faint); letter-spacing: .2px; }
  .slot b { font-size: 27px; font-weight: 700; line-height: 1; letter-spacing: -.5px;
            font-variant-numeric: tabular-nums; }
  .slot.blank b { color: #d2d7dd; font-weight: 500; }
  .slot.on.blank b { color: #b6bec8; }
  .slot.on { border-color: var(--accent); background: var(--accent-soft); }
  .slot.on b, .slot.on em { color: var(--accent); }
  .slot:disabled { opacity: .45; }

  /* ---------- 数字键盘层（盖在所有页面之上，不调系统键盘） ---------- */
  .padlayer {
    position: absolute; inset: 0; z-index: 70;
    background: rgba(14,18,26,.34);
    display: none; flex-direction: column; justify-content: flex-end;
  }
  .padlayer.on { display: flex; }
  .padcard {
    background: var(--card); border-radius: 18px 18px 0 0;
    padding: 4px 16px calc(12px + env(safe-area-inset-bottom));
    display: flex; flex-direction: column;
  }
  .padhd { padding: 14px 2px 0; flex: 0 0 auto; }
  .padhd .t { font-size: 12px; color: var(--muted); }
  .padhd .v {
    font-size: 34px; font-weight: 700; letter-spacing: -.8px; line-height: 1.35;
    font-variant-numeric: tabular-nums; min-height: 46px;
    border-bottom: 2px solid var(--accent); display: flex; align-items: baseline;
  }
  .padhd .v em { font-style: normal; font-size: 14px; color: var(--muted);
                 margin-left: 5px; letter-spacing: 0; font-weight: 500; }
  .padhd .v.ph { color: #cfd4da; }
  .padspacer { flex: 1; min-height: 10px; }
  .pad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 7px; flex: 0 0 auto; }
  .pad button {
    height: 53px; border: 0; border-radius: 12px; background: #f2f3f5;
    font-size: 23px; font-weight: 600; cursor: pointer; color: var(--text);
    font-variant-numeric: tabular-nums;
    display: flex; align-items: center; justify-content: center;
  }
  .pad button:active { background: #e4e7eb; }
  .pad button.fn { font-size: 15px; font-weight: 500; color: var(--muted); background: #ebedf0; }
  .pad button:disabled { opacity: .3; }

  /* ---------- 数值字段（点击弹键盘） ---------- */
  .numfield {
    display: flex; align-items: center; gap: 8px; border: 1.5px solid var(--line);
    border-radius: 11px; padding: 10px 14px; background: #fff; cursor: pointer;
    min-height: 50px;
  }
  .numfield:active { background: var(--accent-soft); }
  .numfield .v { flex: 1; text-align: right; font-size: 21px; font-weight: 600;
                 font-variant-numeric: tabular-nums; letter-spacing: -.2px; }
  .numfield .v.ph { color: #cfd4da; font-weight: 400; font-size: 17px; }
  .numfield .u { font-size: 13px; color: var(--muted); width: 22px; flex: 0 0 auto; }
  .numfield.act { border-color: var(--accent); background: var(--accent-soft); }

  /* ---------- 品牌实际色块 ---------- */
  .sw { width: 30px; height: 30px; border-radius: 8px; flex: 0 0 auto;
        display: flex; align-items: center; justify-content: center;
        font-size: 10.5px; font-weight: 700;
        box-shadow: inset 0 0 0 1px rgba(0,0,0,.07); }
  .sw.big { width: 48px; height: 48px; border-radius: 11px; font-size: 12.5px; }

  /* ---------- 色系筛选 ---------- */
  .fambar {
    display: flex; gap: 6px; overflow-x: auto; padding: 11px 0 11px;
    scrollbar-width: none; position: sticky; top: 0; background: var(--bg); z-index: 5;
    margin: 0 -16px; padding-left: 16px; padding-right: 16px;
  }
  .fambar::-webkit-scrollbar { display: none; }
  .chip {
    border: 0; background: #eceef1; border-radius: 8px; padding: 6px 11px;
    font-size: 12.5px; color: var(--muted); white-space: nowrap; cursor: pointer;
    font-variant-numeric: tabular-nums; display: flex; align-items: center; gap: 4px;
    flex: 0 0 auto;
  }
  .chip.on { background: var(--text); color: #fff; }
  .chip em { font-style: normal; font-size: 10px; opacity: .55; }
  .chip.on em { opacity: .75; }
  .chip.has em { color: var(--accent); font-weight: 700; opacity: 1; }
  .chip.on.has em { color: #a8c1ff; }

  /* ---------- 色卡网格 ---------- */
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(72px, 1fr)); gap: 7px; }
  .bead {
    position: relative; aspect-ratio: 1/1; border: 0; border-radius: 9px;
    display: flex; align-items: center; justify-content: center;
    font-size: 12.5px; font-weight: 600; cursor: pointer; overflow: hidden;
    padding: 0; letter-spacing: .1px;
    transition: transform .1s;
  }
  .bead:active { transform: scale(.95); }
  /* 有库存角标时给底部留位，文字自然居中在剩余空间 */
  .bead.hasq { padding-bottom: 13px; }
  .bead .qty {
    position: absolute; left: 0; right: 0; bottom: 0; padding: 1px 0 2px;
    font-size: 10px; font-weight: 700; text-align: center;
    background: rgba(255,255,255,.94); color: #111;
    font-variant-numeric: tabular-nums;
  }
  .bead .qty.est { background: rgba(254,243,199,.97); color: var(--warn); }
  .bead .multi { position: absolute; top: 5px; right: 5px; width: 5px; height: 5px;
                 border-radius: 50%; background: #fff; box-shadow: 0 0 0 1.5px rgba(0,0,0,.3); }
  /* 低于预警值：左上角一个红标，右上角留给多品牌小点，底部留给颗数 */
  .bead .low {
    position: absolute; top: 3px; left: 3px; width: 15px; height: 15px;
    border-radius: 50%; background: #d93025; color: #fff;
    display: flex; align-items: center; justify-content: center;
    font-size: 10px; font-weight: 800; line-height: 1;
    box-shadow: 0 1px 3px rgba(0,0,0,.32);
  }

  .empty { text-align: center; color: var(--muted); font-size: 13px; padding: 60px 20px; line-height: 1.9; }

  /* ---------- 卡片列表 ---------- */
  .grp { background: var(--card); border-radius: 12px; overflow: hidden; margin-bottom: 10px; }
  .item {
    display: flex; align-items: center; gap: 11px; padding: 12px 13px;
    border-bottom: 1px solid var(--line2); cursor: pointer; background: var(--card);
  }
  .item:last-child { border-bottom: 0; }
  .item:active { background: #f7f8fa; }
  .item .ico { width: 34px; height: 34px; border-radius: 9px; flex: 0 0 auto;
               display: flex; align-items: center; justify-content: center;
               font-size: 12px; font-weight: 700; }
  .item .mid { flex: 1; min-width: 0; }
  .item .mid b { font-size: 14px; display: block; font-weight: 600; }
  .item .mid small { font-size: 11.5px; color: var(--muted); display: block;
                     white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .item .right { text-align: right; font-variant-numeric: tabular-nums; flex: 0 0 auto; }
  .item .right b { font-size: 15px; font-weight: 600; white-space: nowrap; }
  .item .right b i { font-style: normal; font-size: 10.5px; font-weight: 400;
                     color: var(--muted); margin-left: 1px; }
  .item .right small { display: block; font-size: 10.5px; color: var(--muted); }
  .item .arrow { color: #c9ced6; font-size: 15px; flex: 0 0 auto; margin-left: -2px; }

  .tag { font-size: 10px; padding: 1px 5px; border-radius: 4px; font-weight: 500;
         display: inline-block; vertical-align: 1px; }
  .tag.m { background: var(--ok-soft); color: var(--ok); }
  .tag.e { background: var(--warn-soft); color: var(--warn); }
  .tag.n { background: #f0f1f4; color: var(--faint); }

  /* 详情合计 */
  .hero { display: flex; align-items: center; gap: 13px; padding: 14px 2px 16px; }
  .hero .big { width: 58px; height: 58px; border-radius: 12px; flex: 0 0 auto;
               display: flex; align-items: center; justify-content: center;
               font-weight: 700; font-size: 13.5px; }
  .hero .mid { flex: 1; min-width: 0; }
  .hero .mid .n { font-size: 27px; font-weight: 700; letter-spacing: -.6px;
                  font-variant-numeric: tabular-nums; line-height: 1.15; }
  .hero .mid .n span { font-size: 12.5px; font-weight: 500; color: var(--muted); margin-left: 3px; }
  .hero .mid .g { font-size: 12px; color: var(--muted); }

  .sect-t { font-size: 11.5px; color: var(--faint); font-weight: 500;
            letter-spacing: .4px; padding: 16px 2px 7px; display: flex; align-items: center; }
  .sect-t .sp { margin-left: auto; font-weight: 400; font-size: 11px; }

  /* 色号清单的排序开关 */
  .sect-t .sortbtn {
    margin-left: auto; border: 0; background: none; cursor: pointer;
    padding: 4px 3px 4px 10px; font: inherit; font-size: 11px;
    color: var(--accent); display: inline-flex; align-items: center; gap: 3px;
    font-variant-numeric: tabular-nums;
    white-space: nowrap; flex: 0 0 auto;
  }
  .sect-t .sortbtn i { font-style: normal; font-size: 10px; opacity: .5; margin-right: 1px; }
  .sortrow { display: flex; gap: 7px; flex-wrap: wrap; padding: 0 2px 9px; }
  .sortrow .diachip { padding: 7px 11px; font-size: 12px; border-radius: 8px; }

  /* 日志 */
  .log { display: flex; gap: 9px; padding: 9px 13px; border-bottom: 1px solid var(--line2);
         font-size: 12.5px; background: var(--card); }
  .log:last-child { border-bottom: 0; }
  .log .t { color: var(--faint); font-size: 10.5px; flex: 0 0 40px; padding-top: 2px;
            font-variant-numeric: tabular-nums; }
  .log .c { flex: 1; line-height: 1.45; }
  .log .c em { font-style: normal; color: var(--muted); }

  /* ---------- 底部 tabbar ---------- */
  .tabbar {
    display: flex; background: rgba(255,255,255,.97); border-top: 1px solid var(--line);
    padding-bottom: env(safe-area-inset-bottom); flex: 0 0 auto;
    backdrop-filter: blur(12px);
  }
  .tabbar button {
    flex: 1; border: 0; background: transparent; padding: 8px 0 7px;
    font-size: 10.5px; color: var(--faint); cursor: pointer;
    display: flex; flex-direction: column; align-items: center; gap: 3px;
  }
  .tabbar button .i { font-size: 19px; line-height: 1; }
  .tabbar button.on { color: var(--accent); font-weight: 600; }

  /* ---------- Bottom Sheet ---------- */
  .scrim {
    position: absolute; inset: 0; background: rgba(12,16,22,.42); z-index: 60;
    opacity: 0; pointer-events: none; transition: opacity .22s;
  }
  .scrim.on { opacity: 1; pointer-events: auto; }
  .sheet {
    position: absolute; left: 0; right: 0; bottom: 0; z-index: 61;
    background: var(--card); border-radius: 18px 18px 0 0;
    transform: translateY(101%); transition: transform .28s cubic-bezier(.32,.72,0,1);
    max-height: 92%; display: flex; flex-direction: column;
    padding-bottom: calc(14px + env(safe-area-inset-bottom));
  }
  .sheet.on { transform: translateY(0); }
  .sheet .handle { width: 34px; height: 4px; border-radius: 2px; background: #dcdfe4;
                   margin: 8px auto 0; flex: 0 0 auto; }
  .sheet .sh { padding: 12px 18px 0; flex: 0 0 auto; }
  .sheet .sh h3 { font-size: 16.5px; font-weight: 650; }
  .sheet .sh p { font-size: 12px; color: var(--muted); margin-top: 3px; }
  .sheet .sb { padding: 4px 18px 0; overflow-y: auto; min-height: 0; }

  .lbl { font-size: 11.5px; color: var(--faint); margin: 14px 0 6px; letter-spacing: .3px; }
  .diachips { display: flex; gap: 7px; }
  .diachip {
    border: 1.5px solid var(--line); background: #fff; border-radius: 9px;
    padding: 8px 14px; font-size: 13px; cursor: pointer; font-variant-numeric: tabular-nums;
  }
  .diachip.on { border-color: var(--accent); background: var(--accent-soft);
                color: var(--accent); font-weight: 600; }
  #bi-dias .dia { flex: 0 0 auto; min-width: 84px; }
  .seg { display: flex; gap: 3px; background: #f0f1f4; padding: 3px; border-radius: 10px; }
  .seg button {
    flex: 1; border: 0; background: transparent; padding: 8px 4px; border-radius: 8px;
    font-size: 13px; color: var(--muted); cursor: pointer; white-space: nowrap;
  }
  .seg button.on { background: var(--card); color: var(--text); font-weight: 600;
                   box-shadow: 0 1px 4px rgba(0,0,0,.1); }
  .seg button:disabled { opacity: .35; }

  .numin { display: flex; align-items: center; gap: 9px; }

  .prev { background: #f6f7f9; border-radius: 10px; padding: 11px 13px; font-size: 12.5px;
          margin-top: 14px; color: var(--muted); line-height: 1.7; }
  .prev b { color: var(--text); font-variant-numeric: tabular-nums; }
  .prev .w { color: var(--warn); }
  .prev .line { display: flex; justify-content: space-between; gap: 8px; }
  .prev .good { color: var(--ok); font-weight: 600; font-variant-numeric: tabular-nums; }
  .prev .bad  { color: var(--danger); font-weight: 600; font-variant-numeric: tabular-nums; }
  .prev hr { border: 0; border-top: 1px solid var(--line); margin: 8px 0; }

  /* 颗重那一条：左边是当前值，右边是入口 */
  .calrow {
    display: flex; align-items: center; gap: 8px; margin-top: 10px;
    padding: 10px 12px; background: #f6f7f9; border-radius: 10px;
    font-size: 12px; color: var(--muted); line-height: 1.5;
  }
  .calrow b { color: var(--text); font-variant-numeric: tabular-nums; }
  .calrow .lnk {
    margin-left: auto; flex: 0 0 auto; border: 0; background: none; padding: 2px 0 2px 6px;
    font-size: 12px; font-weight: 600; color: var(--accent); cursor: pointer;
  }
  .calrow .lnk:active { opacity: .6; }
  .calrow .just { color: var(--ok); font-weight: 600; }

  .hint {
    background: var(--accent-soft); border-radius: 10px; padding: 10px 12px;
    font-size: 12px; line-height: 1.65; color: #33507f; margin-bottom: 12px;
  }
  .hint b { color: #1f3d70; font-weight: 600; }

  .acts { display: flex; gap: 9px; padding: 16px 18px 0; flex: 0 0 auto; }
  .btn {
    flex: 1; border: 0; border-radius: 11px; padding: 13px; font-size: 14.5px;
    cursor: pointer; background: #f0f1f4; color: var(--text); font-weight: 500;
  }
  .btn.pri { background: var(--accent); color: #fff; font-weight: 600; }
  .btn.dgr { background: #d93025; color: #fff; font-weight: 600; }
  .btn:active { opacity: .82; }

  .field { margin-bottom: 11px; }
  .field label { font-size: 11.5px; color: var(--faint); display: block; margin-bottom: 5px; }
  .field input {
    width: 100%; border: 1.5px solid var(--line); border-radius: 10px;
    padding: 11px 13px; font-size: 14px; outline: none; background: #fff;
  }
  .field input:focus { border-color: var(--accent); background: var(--accent-soft); }

  /* ---------- 直径快捷选择 ---------- */
  .dias { display: flex; gap: 7px; }
  .dia {
    flex: 1 1 0; min-width: 0; height: 48px; border: 1.5px solid var(--line);
    border-radius: 11px; background: var(--card); cursor: pointer; padding: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 1px; font-size: 14px; font-weight: 600; color: var(--text);
    font-variant-numeric: tabular-nums; transition: border-color .12s, background .12s;
  }
  .dia em {
    font-style: normal; font-size: 9.5px; font-weight: 400;
    color: var(--faint); letter-spacing: .2px;
  }

/* ===================== 色号主数据（内置只读） ===================== */
const COLORS = [], BY_CODE = {}, FAMILIES = [];
DATA.series.forEach(s => {
  FAMILIES.push(s.prefix);
  s.colors.forEach(c => {
    const o = { code: c.code, family: s.prefix, num: c.num, hex: c.hex };
    COLORS.push(o); BY_CODE[c.code] = o;
  });
});

/* ===================== 状态 ===================== */
/**
 * 模型 v6：库存只有一层。
 *   stock   —— 每个「色号 + 直径」一行，只有 qty（颗数）一个权威值
 *   sources —— 品牌 / 店铺 / 散装，只是入库时的来源标签，不进库存维度
 *   inLog   —— 入库流水，记着这批从哪来、当时称了多少克
 *
 * 为什么这么分：录入时区分来源是为了算数量（一袋 60 g 直接换算成颗数），
 * 买回来倒进盒子里之后就是同一堆豆子。扣减只在 stock.qty 上做减法，
 * 永远不需要问"从哪个牌子扣"。
 */
const KEY = 'bean-stock-v6';

function blank(){
  return { sources: [], dias: [], stock: {}, inLog: [], logs: [],
           patterns: [], seq: 10, warn: 500, pseq: 1 };
}

function seed(){
  const s = blank(), now = Date.now(), D = 86400000;
  s.dias = [2.6];
  s.sources = [
    // gpb：这个来源的颗重，只在「称重入库」和「称重校正」时用
    { id:'s1', name:'MARD 原厂', kind:'brand', packG:60, gpb:0.0190, cat: now-D*3,
      swatch:{ A21:'#E9B7B1' } },
    { id:'s2', name:'散装 · 某店', kind:'shop', packG:null, gpb:null, cat:null, swatch:{} }
  ];

  // 库存：qty 是唯一权威。gpb 只是"这堆豆子的平均颗重"，用来显示 ≈克数
  // cal ＝ 最近一次量的样本（颗数 / 净重），重开标定页时接着改，只留这一份
  const put = (code, qty, at, cal) => {
    s.stock[code + '|2.6'] = { qty, gpb:0.019, at };
    if (cal) s.stock[code + '|2.6'].cal = cal;
  };
  put('A21', 3589, now-D*2, { n:1989, m:37.8, at:now-D*2 });
  put('A1',  1579, now-D*2, { n:1579, m:30.0, at:now-D*2 });
  put('A9',   800, now-D*5);
  put('B9',   474, now-D*6);
  put('H7',   447, now-D*8);
  put('M3',  1126, now-D*9);

  s.inLog = [
    { ts:now-D*9, code:'A21', dia:2.6, qty:1600, g:null, sid:'s2' },
    { ts:now-D*2, code:'A21', dia:2.6, qty:1989, g:37.8, sid:'s1' },
    { ts:now-D*2, code:'A1',  dia:2.6, qty:1579, g:30.0, sid:'s1' }
  ];

  s.patterns = [
    { id:'p1', name:'小蘑菇', img:null, dia:2.6, at:now-D*1,
      items:{ A21:120, A1:60, B7:80, C9:40, H7:90, A9:30 } },
    { id:'p2', name:'练手方块', img:null, dia:2.6, at:now-D*4,
      items:{ A21:200, A1:100 } }
  ];
  s.pseq = 3;
  s.patSort = 'need';   // 色号清单默认按需要颗数倒序

  s.logs = [
    { ts:now-D*2, sid:'s1', code:'A21', type:'IN',
      note:'+1,989 颗 · 称 37.80 g ÷ 0.0190 g/颗 → 共 3,589 颗' },
    { ts:now-D*2, sid:'s1', code:'A1', type:'IN',
      note:'+1,579 颗 · 称 30.00 g ÷ 0.0190 g/颗 → 共 1,579 颗' },
    { ts:now-D*3, sid:null, code:'A21', type:'CALIBRATE',
      note:'2.6mm 颗重 0.0190 g/颗（1,989 颗 37.80 g）' },
    { ts:now-D*9, sid:'s2', code:'A21', type:'IN',
      note:'+1,600 颗 · 按颗 → 共 1,600 颗' }
  ];
  return s;
}

function load(){
  try {
    let raw = localStorage.getItem(KEY);
    // Android 壳：localStorage 被清掉（清缓存 / 重装）时，从应用私有目录的备份顶上
    if (!raw && window.AndroidBridge && AndroidBridge.loadJson){
      try {
        const b = AndroidBridge.loadJson();
        if (b) { raw = b; localStorage.setItem(KEY, b); }
      } catch(e){}
    }
    if (!raw) return seed();
    const o = JSON.parse(raw);
    return { sources:o.sources||[], dias:o.dias||[], stock:o.stock||{}, inLog:o.inLog||[],
             logs:o.logs||[], patterns:o.patterns||[],
             seq:o.seq||10, pseq:o.pseq||1,
             warn: o.warn === undefined ? 500 : o.warn };
  } catch(e){ return seed(); }
}
function save(){
  const json = JSON.stringify(S);
  localStorage.setItem(KEY, json);
  // 壳里再多存一份到 filesDir，localStorage 不可靠（清缓存/换机）
  if (window.AndroidBridge && AndroidBridge.saveJson){
    try { AndroidBridge.saveJson(json); } catch(e){}
  }
}
let S = load();

/* ===================== 工具 ===================== */
const $ = id => document.getElementById(id);

function lum(hex){
  const f = c => { c/=255; return c <= 0.03928 ? c/12.92 : Math.pow((c+0.055)/1.055, 2.4); };
  return .2126*f(parseInt(hex.slice(1,3),16)) + .7152*f(parseInt(hex.slice(3,5),16)) + .0722*f(parseInt(hex.slice(5,7),16));
}
function textStyle(hex){
  return lum(hex) > 0.42 ? 'color:#1a1a1a' : 'color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.5)';
}
function hexOf(code){ return BY_CODE[code].hex; }
/** MARD 标准色（内置，不可改）。库存格子一律用它 */
function hexStd(code){ return BY_CODE[code].hex; }
/** 某个来源下该色号的实际色值：只在来源页和入库流水里展示 */
function hexFor(sid, code){
  const s = sid ? sourceOf(sid) : null;
  return (s && s.swatch && s.swatch[code]) || BY_CODE[code].hex;
}
function fmt(n,d=2){ return Number(n||0).toLocaleString('zh-CN',{minimumFractionDigits:d,maximumFractionDigits:d}); }
function intFmt(n){ return Number(n||0).toLocaleString('zh-CN'); }
function dayStr(ts){
  if (!ts) return '—';
  const d = new Date(ts), p = n => String(n).padStart(2,'0');
  return `${p(d.getMonth()+1)}-${p(d.getDate())}`;
}
function timeStr(ts){
  if (!ts) return '—';
  const d = new Date(ts), p = n => String(n).padStart(2,'0');
  return `${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
}

/* ---------- 来源（品牌 / 店铺 / 散装） ---------- */
function sourceOf(id){ return S.sources.find(x => x.id === id); }
function sourceLabel(s){ return s ? s.name : '未记来源'; }

/* ---------- 库存：颜色 + 直径 = 一行 ---------- */
function diaKey(code, dia){ return code + '|' + String(Number(dia)); }
function stockAt(code, dia){ return S.stock[diaKey(code, dia)] || null; }
function qtyAt(code, dia){ const it = stockAt(code, dia); return it ? (it.qty || 0) : 0; }

/** 某色号在某直径下的完整状态。has=true 只要这行在，哪怕已经 0 颗 */
function statRow(code, dia){
  const it = stockAt(code, dia);
  if (!it) return { has:false, qty:0, net:null, gpb:null, cal:null, at:null };
  const gpb = it.gpb > 0 ? it.gpb : null;
  return { has:true, qty: it.qty || 0, net: gpb ? (it.qty || 0) * gpb : null,
           gpb, cal: it.cal || null, at: it.at || null };
}

function writeRow(code, dia, qty, gpb, at){
  const k = diaKey(code, dia);
  const cur = S.stock[k];
  const g = (gpb !== undefined && gpb !== null) ? gpb : (cur && cur.gpb) || null;
  const row = { qty: Math.max(0, Math.round(qty)), gpb: g, at: at || Date.now() };
  if (cur && cur.cal) row.cal = cur.cal;      // 标定样本跟着行走，别被扣减/入库顺手抹掉
  S.stock[k] = row;
  if (!S.dias.some(d => Number(d) === Number(dia))){ S.dias.push(Number(dia)); S.dias.sort((a,b)=>a-b); }
}

/**
 * 入库：把来源、克重记进流水，库存只增加颗数。
 * gpbIn 是「这一行的颗重」，由标定决定；给了就用它，不再拿 g÷qty 反推
 * （g 是这次入库的克数、qty 是这次入库的颗数，两者都只代表「增量」，
 *   反推会得到同一批的平均值，但一旦有取整就会把标定值带偏）。
 */
function stockIn(code, dia, qty, g, sid, gpbIn){
  const src = sid ? sourceOf(sid) : null;
  const cur = stockAt(code, dia);
  const gpb = (gpbIn > 0) ? gpbIn
            : (g > 0 && qty > 0) ? g / qty
            : (cur && cur.gpb) || (src && src.gpb) || null;
  writeRow(code, dia, (cur ? cur.qty : 0) + qty, gpb);
  S.inLog.unshift({ ts:Date.now(), code, dia:Number(dia), qty, g: g || null, sid: sid || null });
  if (S.inLog.length > 300) S.inLog.length = 300;
  return gpb;
}

/**
 * 加总。dia 有值时只算这一个直径；不给就是所有直径合计。
 * lines = 有记录的直径条数（>1 说明这个色号有多个规格）
 */
function agg(code, dia){
  const ds = dia ? [dia] : S.dias;
  let count = 0, weight = 0, lines = 0, lastAt = null, missingW = 0;
  ds.forEach(d => {
    const it = stockAt(code, d);
    if (!it) return;
    lines++;
    count += it.qty || 0;
    if (it.gpb > 0) weight += (it.qty || 0) * it.gpb; else missingW++;
    if (it.at && (!lastAt || it.at > lastAt)) lastAt = it.at;
  });
  return { count, weight, lines, lastAt, missingW, hasW: missingW === 0 };
}
function totalCount(){ let n = 0; COLORS.forEach(c => { n += agg(c.code).count; }); return n; }
function stockedColors(){ let n = 0; COLORS.forEach(c => { if (agg(c.code).count > 0) n++; }); return n; }

const TYPE_CN = { SET:'设为', SUB:'扣减', ADD:'增加', IN:'入库', CALIBRATE:'标定',
                  BULK_INIT:'初始化', WARN_SET:'预警', SWATCH_SET:'实际色',
                  SRC_NEW:'新来源', SRC_EDIT:'改来源', ARCHIVE:'删除',
                  PAT_NEW:'新图案', PAT_DEL:'删图案', BATCH_SUB:'整图扣减', UNDO:'撤销' };

function logIt(sid, code, type, note){
  S.logs.unshift({ ts:Date.now(), sid, code, type, note });
  if (S.logs.length > 500) S.logs.length = 500;
}

function patOf(id){ return S.patterns.find(p => p.id === id); }

/** 这个图案还差哪些豆子（同直径合计，不分牌子） */
function patternStat(p){
  const miss = [];
  let need = 0, colors = 0;
  Object.keys(p.items).forEach(code => {
    const want = p.items[code];
    if (!(want > 0)) return;
    colors++; need += want;
    const have = agg(code, p.dia).count || 0;
    if (have < want) miss.push({ code, want, have, lack: want - have });
  });
  miss.sort((a, b) => b.lack - a.lack);
  return { miss, need, colors, ok: miss.length === 0,
           lackSum: miss.reduce((n, m) => n + m.lack, 0) };
}

/** 库里实际有货的直径，按颗数从多到少 */
function diaList(){
  const m = {};
  S.dias.forEach(d => {
    let n = 0;
    COLORS.forEach(c => { n += qtyAt(c.code, d); });
    m[d] = n;
  });
  return Object.keys(m).map(Number).sort((a, b) => m[b] - m[a]);
}
function defaultDia(){
  const ds = diaList();
  return ds.length ? ds[0] : 2.6;
}

function thumbHtml(p){
  if (p.img) return `<div class="thumb"><img src="${p.img}" alt=""></div>`;
  const codes = Object.keys(p.items).slice(0, 9);
  const cells = Array.from({ length: 9 }, (_, i) =>
    `<i style="background:${codes[i] ? hexOf(codes[i]) : '#f1f3f5'}"></i>`).join('');
  return `<div class="thumb">${cells}</div>`;
}

function missRows(st){
  return `<div class="miss">` + st.miss.map(m => `
    <div class="row">
      <div class="sw" style="background:${hexOf(m.code)};${textStyle(hexOf(m.code))}">${m.code.replace(/[A-Z]/g,'')}</div>
      <div class="c"><b>${m.code}</b> <span class="d">需 ${intFmt(m.want)} / 有 ${intFmt(m.have)}</span></div>
      <div class="n">缺 ${intFmt(m.lack)}</div>
    </div>`).join('') + `</div>`;
}

  box.innerHTML = S.patterns.map(p => {
    const st = patternStat(p);
    return `<div class="grp" style="margin-bottom:11px">
      <div class="pat" data-p="${p.id}">

        <div class="pm">

          <small>${st.colors} 色 · 共 ${intFmt(st.need)} 颗</small>
          <span class="st ${st.ok ? 'ok' : 'no'}" data-miss="${p.id}" data-open="0">
            ${st.ok ? '库存够' : `缺 ${st.miss.length} 色 · ${intFmt(st.lackSum)} 颗`}
          </span>
        </div>
      </div>
      <div id="miss-${p.id}" style="display:none">${missRows(st)}</div>
    </div>`;
  }).join('');

  box.querySelectorAll('.pat').forEach(el => {
    el.onclick = () => openPattern(el.dataset.p);
  });
  box.querySelectorAll('.st').forEach(el => {
    el.onclick = ev => {
      ev.stopPropagation();
      const pid = el.dataset.miss, panel = $('miss-' + pid);
      const open = el.dataset.open === '1';
      el.dataset.open = open ? '0' : '1';
      panel.style.display = open ? 'none' : '';
      if (!open && !patternStat(patOf(pid)).ok){
        el.innerHTML = el.innerHTML;  // 保持文案，只切换箭头感
      }
    };
  });
}

/* ===================== 图案详情 ===================== */
/**
 * 色号清单的排序方式。默认「数量多→少」，因为拼的时候是从最多的那种颜色先下手；
 * 补货的场景再用「缺料优先」。选过的值存在 S.patSort 里，跨图案、跨次打开都记住。
 */
const PAT_SORTS = [
  { k:'need',    t:'数量多→少', short:'数量↓' },
  { k:'needAsc', t:'数量少→多', short:'数量↑' },
  { k:'lack',    t:'缺料优先',   short:'缺料优先' },
  { k:'code',    t:'色号顺序',   short:'色号顺序' }
];
function cmpCode(a, b){ return String(a).localeCompare(String(b), 'en', { numeric:true }); }
function patSortKey(){
  const k = S.patSort;
  return PAT_SORTS.some(x => x.k === k) ? k : 'need';
}
/** 清单与扣减确认页共用同一个顺序，两处对不上会看得很别扭 */
function patRows(p){
  const rows = Object.keys(p.items).map(code => {
    const want = Math.max(0, p.items[code] || 0);
    const have = agg(code, p.dia).count || 0;
    return { code, want, have, lack: Math.max(0, want - have) };
  });
  const by = {
    need:    (a,b) => (b.want - a.want) || cmpCode(a.code, b.code),
    needAsc: (a,b) => (a.want - b.want) || cmpCode(a.code, b.code),
    lack:    (a,b) => (b.lack - a.lack) || (b.want - a.want) || cmpCode(a.code, b.code),
    code:    (a,b) => cmpCode(a.code, b.code)
  };
  return rows.sort(by[patSortKey()]);
}

/**
 * 图案的颜色分布条：按每个色号的颗数占比分宽度，主色一眼就看出来。
 * cls = huebig（没图，96px 高）/ huthin（有图，压成图下 7px 细条）
 */
function hueBar(items, cls){
  const codes = Object.keys(items || {});
  if (!codes.length) return `<div class="${cls}"><i style="background:#e9ebef;flex:1 0 0"></i></div>`;
  const total = codes.reduce((a, c) => a + Math.max(1, items[c] || 0), 0);
  // 色号少的时候把代码写进色块，色带本身就成了一目了然的配色清单
  const showCode = cls === 'huebig' && codes.length <= 8;
  return `<div class="${cls}">${codes.map(c => {
    const w = Math.max(1, items[c] / total * 100);
    const hx = hexOf(c);
    // 太窄的块放不下文字，宁可不写，也不要半个字被切掉
    const txt = (showCode && w >= 10) ? c : '';
    return `<i style="background:${hx};flex:${w.toFixed(2)} 1 0${txt ? ';' + textStyle(hx) : ''}">${txt}</i>`;
  }).join('')}</div>`;
}

function openPattern(id){

  if (!p) return;
  // 撤销只在同一图案的详情页内有效，切到别的图案就作废
  if (lastBatch && lastBatch.pid !== id) lastBatch = null;
  curPat = id;
  const st = patternStat(p);
  $('patd-title').textContent = p.name;

  const list = patRows(p);
  const sortKey = patSortKey();
  const sortLabel = (PAT_SORTS.find(x => x.k === sortKey) || PAT_SORTS[0]).short;

  $('patd-body').innerHTML = `
    ${(lastBatch && lastBatch.pid === id) ? `
      <div class="undo">
        <div class="c">
          <b>已扣减 ${lastBatch.colors} 色 ${intFmt(lastBatch.need)} 颗</b>
          <small>${timeStr(lastBatch.at)} · 切到别的图案后不能再撤销</small>
        </div>
        <button class="btn" id="patd-undobtn">撤销</button>
      </div>` : ''}

    <div class="pathead${p.img ? ' hasimg' : ''}">
      ${p.img
        ? `<img class="patimg" id="patd-img" src="${p.img}" alt="">
           <div class="imgact">
             <button class="dark" id="patd-imgbtn">换图</button>
             <button id="patd-imgdel">移除</button>
           </div>
           ${hueBar(p.items, 'huthin')}`
        : `<button class="huecard" id="patd-imgbtn">
             ${hueBar(p.items, 'huebig')}
             <span class="huehint">${Object.keys(p.items).length} 种颜色 · <em>＋ 加一张图</em>（可选）</span>
           </button>`}
      <input type="file" id="patd-file" accept="image/*" style="display:none">
    </div>

    <div class="sect-t">够不够拼<span class="sp">${p.dia ? String(p.dia).replace(/\.0$/,"") + 'mm · ' : ''}${st.colors} 色 · 共 ${intFmt(st.need)} 颗</span></div>
    <div class="grp" style="padding:14px">
      ${st.ok
        ? `<div style="font-size:15px;font-weight:600;color:var(--ok)">库存够，可以直接拼</div>
           <div style="font-size:12px;color:var(--muted);margin-top:5px;line-height:1.7">
             ${st.colors} 个色号的现有颗数都够用（同直径合计，不分牌子）。</div>
           <button class="btn pri" id="patd-consume" style="margin-top:12px">整图扣减 ${intFmt(st.need)} 颗</button>
           ${p.lastUse ? `<div style="font-size:11px;color:var(--faint);margin-top:9px">
             上次扣减：${timeStr(p.lastUse)}</div>` : ''}`
        : `<div style="font-size:15px;font-weight:600;color:#b3271c">
             还差 ${st.miss.length} 个色号，合计 ${intFmt(st.lackSum)} 颗</div>
           <div style="font-size:12px;color:var(--muted);margin-top:5px;line-height:1.7">
             按同直径合计算的，明细在下面。补够之后才能整图扣减。</div>
           <button class="btn pri" id="patd-copy" style="margin-top:12px">复制补货清单</button>`}
    </div>

    <div class="sect-t">色号清单
      <button class="sortbtn" id="patd-sortbtn">⇅ ${sortLabel}<i>›</i></button>
    </div>
    <div class="sortrow" id="patd-sortrow" style="display:none">
      ${PAT_SORTS.map(x => `<button class="diachip${x.k === sortKey ? ' on' : ''}"
          data-sort="${x.k}">${x.t}</button>`).join('')}
    </div>
    <div class="grp">${list.map(({ code, want, have, lack }) => {
      const hx = hexOf(code);
      return `<div class="item" data-code="${code}">
        <div class="sw" style="background:${hx};${textStyle(hx)}">${code.replace(/[A-Z]/g,'')}</div>

          <b>${code}${lack ? ' <span class="tag m" style="background:#fdecea;color:#b3271c">缺 ' + intFmt(lack) + '</span>' : ''}</b>
          <small>需要 ${intFmt(want)} 颗 · 现有 ${intFmt(have)} 颗</small>

  // 排序：点标题右侧展开选项，选完记住（存 S.patSort，换图案也不变）
  const sortBtn = $('patd-sortbtn');

    const row = $('patd-sortrow');

      S.patSort = b.dataset.sort;
      save();
      openPattern(id);
      renderPatterns();
    };
  });

  const undoBtn = $('patd-undobtn');
  if (undoBtn) undoBtn.onclick = () => {
    if (!confirm(`撤销这次扣减，把 ${lastBatch.colors} 色 ${intFmt(lastBatch.need)} 颗退回库存？`)) return;
    const r = undoConsume();
    if (!r.ok && r.reason === 'drift'){
      const names = r.keys.map(k => k.split('|')[0]).join('、');
      alert(`这些色号的库存在扣减之后又变过，撤销会把那些改动一起抹掉，所以不能撤销：\n\n${names}`);
      return;
    }
    if (!r.ok) return;
    openPattern(id); renderPatterns(); renderStock();
  };

  const imgBtn = $('patd-imgbtn');
  if (imgBtn) imgBtn.onclick = () => $('patd-file').click();
  $('patd-file').onchange = e => {
    const f = e.target.files && e.target.files[0];
    if (!f) return;
    shrinkImage(f, dataUrl => {
      p.img = dataUrl; p.at = Date.now(); save();
      openPattern(id); renderPatterns();
    });
  };
  const imgDel = $('patd-imgdel');
  if (imgDel) imgDel.onclick = () => {
    delete p.img; p.at = Date.now(); save();
    openPattern(id); renderPatterns();
  };

  $('patd-body').querySelectorAll('.item').forEach(el => {
    el.onclick = ev => {
      if (ev.target.dataset.del) return;
      const code = el.dataset.code;
      numPad({
        title: `${code} 需要多少颗`, unit:'颗', decimal:false, value: p.items[code],
        onOk: v => { p.items[code] = Math.round(v); p.at = Date.now(); save(); openPattern(id); renderPatterns(); }
      });
    };
  });
  $('patd-body').querySelectorAll('[data-del]').forEach(b => {
    b.onclick = ev => {
      ev.stopPropagation();
      const code = b.dataset.del;
      if (!confirm(`从「${p.name}」里去掉 ${code}？`)) return;
      delete p.items[code]; p.at = Date.now(); save();
      openPattern(id); renderPatterns();
    };
  });
  $('patd-add').onclick = () => addColors(id);

  $('p-patd').classList.add('on');
}

/* ===================== 整图扣减确认页 ===================== */
function openConsume(pid){
  const p = patOf(pid);
  if (!p) return;
  const st = patternStat(p);
  if (!st.ok){ alert('还有色号不够，先补齐再扣减。'); return; }

  const plan = planConsume(p);

  sheet(`
    <div class="sh">
      <h3>整图扣减</h3>
      <p>把「${p.name}」的 ${st.colors} 色 ${intFmt(st.need)} 颗从库存扣掉。同色号同直径的豆子本来就当一堆算，扣完了不用管是哪家买的。</p>
    </div>
    <div class="sb" id="bc-body"></div>
    <div class="acts">
      <button class="btn" id="bc-cancel">取消</button>
      <button class="btn pri" id="bc-ok">确认扣减</button>
    </div>
  `);

  const box = $('bc-body');
  box.innerHTML = `<div class="grp">` + plan.rows.map(r => {
    const hx = hexOf(r.code);
    return `<div class="bc">
      <div class="bch">
        <div class="sw" style="background:${hx};${textStyle(hx)}">${r.code.replace(/[A-Z]/g,'')}</div>
        <div class="mid">
          <b>${r.code}</b>
          <div class="bcp">
            <span class="bv">${intFmt(r.before)}</span>
            <span class="ba">→</span>
            <span class="bv ${r.after === 0 ? 'z' : ''}">${intFmt(r.after)}</span>
          </div>
        </div>
        <div class="br"><b>扣 ${intFmt(r.qty)}</b></div>
      </div>
    </div>`;
  }).join('') + `</div>

  <div class="bcsum">
    共扣 <b>${intFmt(plan.total)}</b> 颗${plan.zeroed ? `，<span class="w">${plan.zeroed} 个色号会清零</span>` : ''}
    <br><span>扣完可以撤销，切到别的图案就不能撤了。</span>
  </div>`;

  $('bc-cancel').onclick = closeSheet;
  $('bc-ok').onclick = () => {
    runConsume(p, plan);
    closeSheet();
    openPattern(pid);
    renderPatterns(); renderStock();
  };
}

/* 连续录入色号：选一个 → 输数量 → 回来接着选 */
function addColors(pid){
  const p = patOf(pid);
  let added = 0;

  openPicker({
    title: `给「${p.name}」加色号`,
    sub: '点色块填数量，填完回来接着点下一个；同一系列不用重选',
    okText: '完成',
    onOk: closeSheet,
    onPick(code, api){
      numPad({
        title: `${code} 需要多少颗`, unit:'颗', decimal:false,
        value: p.items[code] || null,
        onOk(v){
          p.items[code] = Math.round(v);
          p.at = Date.now();
          save();
          added++;
          api.setSub(`已设 ${Object.keys(p.items).length} 个色号，继续点下一个；完成就点下面`);
          openPattern(pid);
          renderPatterns();
        }
      });
    }
  });
}

/* 补货清单文本，直接发给卖家 */
function orderText(p, st){
  const lines = st.miss.map(m => `${m.code}\t缺 ${m.lack} 颗（需 ${m.want} / 有 ${m.have}）`);
  return [
    `拼豆补货 · ${p.name}${p.dia ? '（' + String(p.dia).replace(/\.0$/,'') + 'mm）' : ''}`,
    '————————',
    ...lines,
    '————————',
    `共 ${st.miss.length} 色 ${st.lackSum} 颗（MARD 221 色标准）`
  ].join('\n');
}

/* ===================== 整图扣减 & 撤销 ===================== */
/**
 * 扣减面对的永远是「颜色 + 直径」这一行，没有"从哪个牌子扣"这回事。
 * 撤销只在当前图案详情页内有效：lastBatch 是内存变量，离开或重启即失效。
 */
let lastBatch = null;

function planConsume(p){
  const rows = [];
  // 顺序跟详情页的色号清单一致（patRows），否则确认页和清单对不上
  patRows(p).forEach(({ code }) => {
    const want = p.items[code];
    if (!(want > 0)) return;
    const s = statRow(code, p.dia);
    const have = s.has ? s.qty : 0;
    const q = Math.min(want, have);
    rows.push({ code, want, have, qty:q, before:have, after:have - q,
                short: Math.max(0, want - q), has:s.has });
  });
  const total = rows.reduce((n, r) => n + r.qty, 0);
  const zeroed = rows.filter(r => r.qty > 0 && r.after === 0).length;
  return { rows, total, zeroed, ok: rows.every(r => r.short === 0) };
}

/** 从某一行扣掉 qty 颗。颗数是唯一权威值，扣完克数跟着重算 */
function consumeRow(code, dia, qty){
  const it = stockAt(code, dia);
  const before = it ? (it.qty || 0) : 0;
  const after = Math.max(0, before - qty);
  writeRow(code, dia, after, it ? it.gpb : null);
  return { before, after };
}

function runConsume(p, plan){
  const snap = {};
  let touched = 0;

  plan.rows.forEach(r => {
    if (!(r.qty > 0)) return;
    const k = diaKey(r.code, p.dia);
    snap[k] = { before: JSON.parse(JSON.stringify(stockAt(r.code, p.dia) || null)) };
    consumeRow(r.code, p.dia, r.qty);
    snap[k].after = JSON.parse(JSON.stringify(stockAt(r.code, p.dia) || null));
    touched++;
  });

  lastBatch = {
    pid: p.id, name: p.name, at: Date.now(), dia: p.dia,
    snap,
    need: plan.total,
    colors: plan.rows.filter(r => r.qty > 0).length,
    prevUse: p.lastUse || null
  };
  p.lastUse = Date.now();
  p.at = Date.now();

  logIt(null, null, 'BATCH_SUB',
    `「${p.name}」整图扣减 ${lastBatch.colors} 色 ${intFmt(plan.total)} 颗（可撤销）`);

  save();
  return touched;
}

/**
 * 撤销最近一次整图扣减。
 * 先做冲突检测：受影响行在这之后被改过（手动增减、重新入库、校正…），
 * 撤销会把那些改动一起抹掉，所以直接拒绝。
 */
function undoConsume(){
  const b = lastBatch;
  if (!b) return { ok:false, reason:'none' };

  const drift = Object.keys(b.snap).filter(k => {
    const cur = S.stock[k] || null;
    const want = b.snap[k].after || null;
    return JSON.stringify(cur) !== JSON.stringify(want);
  });
  if (drift.length) return { ok:false, reason:'drift', keys:drift };

  Object.keys(b.snap).forEach(k => {
    const v = b.snap[k].before;
    if (v === null) delete S.stock[k];
    else S.stock[k] = JSON.parse(JSON.stringify(v));
  });
  const p = patOf(b.pid);
  if (p) p.lastUse = b.prevUse;

  logIt(null, null, 'UNDO',
    `撤销「${b.name}」的整图扣减，退回 ${b.colors} 色 ${intFmt(b.need)} 颗`);
  lastBatch = null;
  save();
  return { ok:true };
}

function copyText(txt, btn){
  const done = () => { if (btn){ const old = btn.textContent; btn.textContent = '已复制'; setTimeout(() => btn.textContent = old, 1400); } };
  if (navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(done).catch(() => fallbackCopy(txt, done));
  } else fallbackCopy(txt, done);
}
function fallbackCopy(txt, done){
  const ta = document.createElement('textarea');
  ta.value = txt; ta.style.position = 'fixed'; ta.style.opacity = '0';
  document.body.appendChild(ta); ta.select();
  try { document.execCommand('copy'); done(); } catch(e){ alert('复制失败，长按下面的文字自己选：\\n\\n' + txt); }
  ta.remove();
}

/** 图片压到长边 360，存本地才不至于撑爆容量 */
function shrinkImage(file, cb){
  const fr = new FileReader();
  fr.onload = e => {
    const img = new Image();
    img.onload = () => {
      const max = 360, r = Math.min(1, max / Math.max(img.width, img.height));
      const cv = document.createElement('canvas');
      cv.width = Math.max(1, Math.round(img.width * r));
      cv.height = Math.max(1, Math.round(img.height * r));
      cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
      cb(cv.toDataURL('image/jpeg', 0.72));
    };
    img.src = e.target.result;
  };
  fr.readAsDataURL(file);
}

const SORT_ICO = {
  code:   '<path d="M4 5.6h12M4 10h8.4M4 14.4h5.2"/>',
  recent: '<circle cx="10" cy="10" r="6.3"/><path d="M10 6.1V10l2.7 1.7"/>'
};

function renderSort(){
  $('sort-ico').innerHTML = SORT_ICO[sortMode];
  $('btn-sort').classList.toggle('on', sortMode === 'recent');
  $('btn-sort').setAttribute('aria-label',
    sortMode === 'code' ? '当前按色号排序，点击切为最近操作' : '当前按最近操作排序，点击切为色号顺序');
  const lab = $('pick-label');
  lab.innerHTML = pickedCode
    ? `<span class="v">${pickedCode}</span>`
    : '定位色号';
}

/** 有库存但低于预警值 */
function isLow(a){ return S.warn > 0 && a.lines > 0 && a.count < S.warn; }
function lowCount(){ let n = 0; COLORS.forEach(c => { if (isLow(agg(c.code))) n++; }); return n; }

function renderStock(){
  const low = lowCount();
  // 预警被关掉或已经没东西偏少时，"偏少"这一格会消失，筛选得跟着回到全部
  if (filter === 'low' && !(S.warn > 0 && low > 0)) filter = 'all';
  $('s-sub').innerHTML = `${stockedColors()} 个色号 · ${intFmt(totalCount())} 颗`
    + (low ? ` · <span style="color:#d93025">${low} 个偏少</span>` : '');
  renderSort();
  renderFambar();
  renderGrid();
}

function renderFambar(){
  const has = stockedColors(), low = lowCount();
  const items = [{ k:'all', label:'全部', n:COLORS.length, h:has },
                 { k:'stock', label:'有货', n:has, h:has }];
  // 只有开着预警、且确实有色号偏少时才挂这一格
  if (S.warn > 0 && low > 0) items.push({ k:'low', label:'偏少', n:low, h:low });
  FAMILIES.forEach(f => {
    const inFam = COLORS.filter(c => c.family === f);
    items.push({ k:f, label:f, n:inFam.length,
                 h:inFam.filter(c => agg(c.code).count > 0).length });
  });
  $('fambar').innerHTML = items.map(it => {
    const cnt = (it.k === 'all' || it.k === 'stock') ? it.n : (it.h > 0 ? it.h : it.n);
    return `<button class="chip${filter === it.k ? ' on' : ''}${it.h > 0 ? ' has' : ''}"
              data-f="${it.k}">${it.label}<em>${cnt}</em></button>`;
  }).join('');
  $('fambar').querySelectorAll('.chip').forEach(b => {
    b.onclick = () => { filter = b.dataset.f; renderFambar(); renderGrid(); };
  });
}

function visibleColors(){
  let list = COLORS;
  if (filter === 'stock') list = list.filter(c => agg(c.code).count > 0);
  else if (filter === 'low') list = list.filter(c => isLow(agg(c.code)));
  else if (filter !== 'all') list = list.filter(c => c.family === filter);

  const ord = {}; FAMILIES.forEach((f,i) => ord[f] = i);
  return list.slice().sort((a,b) => {
    if (sortMode === 'recent'){
      const rt = agg(a.code).lastAt || 0, rb = agg(b.code).lastAt || 0;
      if (rt !== rb) return rb - rt;
    }
    return ord[a.family]-ord[b.family] || a.num-b.num;
  });
}

function renderGrid(){
  const list = visibleColors(), g = $('grid');
  if (!list.length){
    g.innerHTML = `<div class="empty" style="grid-column:1/-1">${
      filter === 'stock'
        ? '还没有任何库存<br><span style="font-size:12px;color:var(--faint)">切到「全部」点任意色号开始入库</span>'
        : filter === 'low'
        ? `没有色号低于 ${intFmt(S.warn)} 颗<br><span style="font-size:12px;color:var(--faint)">预警值可以在设置里改</span>`
        : '没有匹配的色号'}</div>`;
    return;
  }
  g.innerHTML = list.map(c => {
    const a = agg(c.code), hx = hexOf(c.code), low = isLow(a);
    let qty = '';
    if (a.lines > 0){
      qty = `<span class="qty">${intFmt(a.count)}</span>`;
    }
    return `<button class="bead${a.count > 0 ? ' hasq' : ''}" data-code="${c.code}"
              style="background:${hx};${textStyle(hx)}">
              ${low ? '<i class="low">!</i>' : ''}
              <span class="code">${c.code}</span>${qty}
              ${a.lines > 1 ? '<i class="multi"></i>' : ''}
            </button>`;
  }).join('');
  g.querySelectorAll('.bead').forEach(b => {
    b.onclick = () => { curCode = b.dataset.code; pickedCode = curCode; openColor(); };
  });
}

/* ===================== 数字键盘（自绘，不调系统输入法） ===================== */
/**
 * 覆盖在 sheet 之上的一层数字键盘。只有 0–9、小数点和退格，配取消/确定。
 * opts: { title, unit, decimal, maxInt, value, onOk }
 */
function numPad(opts){
  const dec = opts.decimal !== false;
  const maxInt = opts.maxInt || 6;
  let str = (opts.value === null || opts.value === undefined) ? '' : String(opts.value);

  const layer = document.createElement('div');
  layer.className = 'padlayer on';
  layer.innerHTML = `
    <div class="padcard">
      <div class="padhd">
        <div class="t">${opts.title || ''}</div>
        <div class="v ph" id="pd-v"><span id="pd-t">0</span><em>${opts.unit || ''}</em></div>
      </div>
      <div class="pad">
        ${['1','2','3','4','5','6','7','8','9','.','0','bksp'].map(k =>
          k === 'bksp'
            ? `<button type="button" class="fn" data-k="bksp">⌫</button>`
            : `<button type="button" data-k="${k}">${k}</button>`
        ).join('')}
      </div>
      <div class="acts" style="padding:12px 0 0">
        <button class="btn" id="pd-c">取消</button>
        <button class="btn pri" id="pd-ok">确定</button>
      </div>
    </div>
  `;
  // 必须挂到 .phone 上：挂到 #sheet 里的话，sheet 收起时（translateY 101%）
  // 键盘会跟着一起跑到屏幕外，看起来就是"点了没反应"
  document.querySelector('.phone').appendChild(layer);

  const vEl = layer.querySelector('#pd-v'), tEl = layer.querySelector('#pd-t');
  const dotBtn = layer.querySelector('[data-k="."]');

  const show = () => {
    tEl.textContent = str === '' ? '0' : str;
    vEl.classList.toggle('ph', str === '');
    dotBtn.disabled = !dec || str.includes('.');
  };

  const push = ch => {
    if (ch === '.'){
      if (!dec || str.includes('.')) return;
      str = str === '' ? '0.' : str + '.';
    } else {
      if (str.includes('.')){
        if (str.split('.')[1].length >= 2) return;         // 最多两位小数
      } else {
        if (str.replace('.','').length >= maxInt) return;   // 上限位数
        if (str === '0') str = '';                          // 去掉前导 0
      }
      str += ch;
    }
    show();
  };

  layer.querySelectorAll('.pad button').forEach(b => {
    b.onclick = () => {
      const k = b.dataset.k;
      if (k === 'bksp'){ str = str.slice(0, -1); show(); return; }
      push(k);
    };
  });
  show();

  const close = () => layer.remove();
  layer.onclick = ev => { if (ev.target === layer) close(); };   // 点遮罩＝放弃
  layer.querySelector('#pd-c').onclick = close;
  layer.querySelector('#pd-ok').onclick = () => {
    if (str === '' || str === '.'){ vEl.style.borderBottomColor = '#dc2626'; return; }
    const v = parseFloat(str);
    if (!(v >= 0)){ vEl.style.borderBottomColor = '#dc2626'; return; }
    close();
    opts.onOk(v);
  };
}

/* ===================== 更新库存 sheet ===================== */
let up = { tid:null, code:null, op:'sub', unit:'pcs', v:null };
/** 因"要先标定"而中断的更新上下文，标定完自动回到这里 */
let pendingBack = null;

function openUpdate(code, dia, opt){
  const o = opt || {};
  const s = statRow(code, dia);
  const canW = s.gpb > 0;
  const d0 = S.sources.length ? S.sources[0].id : null;
  // 没颗重却要求按克 → 退回按颗；其余原样恢复（从标定页回来时会带着这些）
  const wantUnit = (o.unit === 'g' && canW) ? 'g' : 'pcs';

  up = {
    code, dia,
    op: o.op || 'add',
    unit: wantUnit,
    v: (o.v === undefined ? null : o.v),
    sid: (o.sid === undefined ? d0 : o.sid),
    justCal: !!o.justCal
  };

  const nowTxt = !s.has ? '还没有记录'
    : `当前 <b>${intFmt(s.qty)}</b> 颗` + (s.net !== null ? ` · ≈${fmt(s.net)} g` : '');

  sheet(`
    <div class="sh">
      <h3>${code} · ${String(dia).replace(/\.0$/,'')}mm</h3>
      <p>${nowTxt}</p>
    </div>
    <div class="sb">
      <div class="lbl">操作</div>
      <div class="seg" id="seg-op">
        <button data-op="add"${up.op === 'add' ? ' class="on"' : ''}>入库</button>
        <button data-op="sub"${up.op === 'sub' ? ' class="on"' : ''}>扣减</button>
        <button data-op="set"${up.op === 'set' ? ' class="on"' : ''}>设为</button>
      </div>

      <div class="lbl">单位</div>
      <div class="seg" id="seg-unit">
        <button data-unit="pcs"${up.unit === 'pcs' ? ' class="on"' : ''}>颗</button>
        <button data-unit="g"${up.unit === 'g' ? ' class="on"' : ''}>克${canW ? '' : ' 🔒'}</button>
      </div>

      <div id="up-srcwrap">
        <div class="lbl">这批是哪儿买的<span style="color:var(--faint)"> · 只记在流水里，不影响库存</span></div>
        <div class="diachips" id="up-src" style="flex-wrap:wrap">
          ${S.sources.map(x => `<button type="button" class="diachip${x.id === up.sid ? ' on' : ''}"
              data-s="${x.id}">${x.name}</button>`).join('')}
          <button type="button" class="diachip${up.sid ? '' : ' on'}" data-s="">不记</button>
        </div>
      </div>

      <div class="lbl">数量</div>
      <div class="numfield" id="up-field">
        <span class="v ph" id="up-disp">点此输入</span>
        <span class="u" id="up-u">颗</span>
      </div>

      <!-- 颗重始终可改：这袋跟上次不一样就重新称一遍，整行只留最新这一份 -->
      <div class="calrow">
        <span id="up-caltxt"></span>
        <button type="button" class="lnk" id="up-cal"></button>
      </div>

      <div class="prev" id="up-prev">点上面的输入框，用自带键盘填数量</div>
    </div>
    <div class="acts">
      <button class="btn" id="up-cancel">取消</button>
      <button class="btn pri" id="up-ok">确定</button>
    </div>
  `);

  function paint(){
    $('up-u').textContent = up.unit === 'pcs' ? '颗' : 'g';
    document.querySelectorAll('#seg-op button').forEach(b =>
      b.classList.toggle('on', b.dataset.op === up.op));
    document.querySelectorAll('#seg-unit button').forEach(b =>
      b.classList.toggle('on', b.dataset.unit === up.unit));
    document.querySelectorAll('#up-src .diachip').forEach(b =>
      b.classList.toggle('on', (b.dataset.s || '') === (up.sid || '')));
    $('up-srcwrap').style.display = up.op === 'add' ? '' : 'none';

    const disp = $('up-disp');
    if (up.v === null){
      disp.textContent = '点此输入'; disp.classList.add('ph');
    } else {
      disp.textContent = up.unit === 'g' ? fmt(up.v, 2) : intFmt(up.v);
      disp.classList.remove('ph');
    }

    const sr = statRow(code, dia);
    $('up-caltxt').innerHTML = sr.gpb
      ? `颗重 <b>${sr.gpb.toFixed(4)}</b> g/颗` +
        (up.justCal ? ' <span class="just">· 刚更新</span>'
                    : (sr.cal ? `<span style="color:var(--faint)"> · 上次 ${sr.cal.n} 颗 ${fmt(sr.cal.m)} g</span>` : ''))
      : '还没记颗重，按克记要先测一次';
    $('up-cal').textContent = sr.gpb ? '重新标定 ›' : '去测一次 ›';

    const r = calcUpdate(code, dia);
    const box = $('up-prev');
    if (!r){ box.innerHTML = '点上面的输入框，用自带键盘填数量'; return; }

    // 第一句永远是「这次变了多少颗」——用户最想知道的是这个，不是前后总量
    const before = statRow(code, dia);
    const dQty = r.qty - (before.qty || 0);
    const dNet = (r.net || 0) - (before.net || 0);
    const gVal = up.unit !== 'g' ? null
               : (up.op === 'set' ? up.v : Math.abs(dNet));
    const mv = moveText(up.op, up.unit, dQty, gVal, r.qty, before.qty || 0, r.gpb);

    let html = '';
    if (up.unit === 'g'){
      html = up.op === 'set'
        ? `称 <b>${fmt(gVal || 0)} g</b> ≈ <b>${intFmt(r.qty)}</b> 颗`
        : `本次 <b>${mv.sign}${fmt(gVal || 0)} g</b> ≈ <b>${mv.sign}${intFmt(mv.absQ)}</b> 颗`;
    } else {
      html = up.op === 'set'
        ? `设为 <b>${intFmt(r.qty)}</b> 颗`
        : `本次 <b>${mv.sign}${intFmt(mv.absQ)}</b> 颗`;
    }

    // 第二句：前后对照，颗数在前（真值），克数在后（参考）
    html += `<br><b>${intFmt(before.qty || 0)}</b> → <b>${intFmt(r.qty)}</b> 颗`
          + (r.gpb ? `　≈${fmt(before.net || 0)} → ≈<b>${fmt(r.net)}</b> g` : '');

    if (up.op === 'add' && up.sid){
      const src = sourceOf(up.sid);
      html += `<br>记到 <b>${src ? src.name : '—'}</b> 名下，流水里能查到`;
    }
    if (r.over) html += '<br><span class="w">超出当前库存，将按 0 处理</span>';
    box.innerHTML = html;
  }

  $('up-field').onclick = () => numPad({
    title: `${code} · ${String(dia).replace(/\.0$/,'')}mm　${up.unit === 'pcs' ? '按颗' : '按重量'}`,
    unit: up.unit === 'pcs' ? '颗' : 'g',
    decimal: up.unit === 'g',
    value: up.v,
    onOk: v => { up.v = v; paint(); }
  });

  document.querySelectorAll('#seg-op button').forEach(b => {
    b.onclick = () => { up.op = b.dataset.op; paint(); };
  });
  document.querySelectorAll('#seg-unit button').forEach(b => {
    b.onclick = () => {
      if (b.dataset.unit === 'g' && !canW){
        pendingBack = { code, dia, op:up.op, v:up.v, sid:up.sid, unit:'g', justCal:true };
        needCalibrate(code, dia);
        return;
      }
      up.unit = b.dataset.unit; paint();
    };
  });
  document.querySelectorAll('#up-src .diachip').forEach(b => {
    b.onclick = () => { up.sid = b.dataset.s || null; paint(); };
  });

  // 重新标定：把当前录入状态一起带走，标完原样回来（已填的数量不丢）
  $('up-cal').onclick = () => openCalibrate({ code, dia }, {
    code, dia, op:up.op, v:up.v, sid:up.sid,
    unit: canW ? up.unit : 'g',      // 本来没有颗重，测完就是要按克记
    justCal: true
  });

  delete up.over;
  $('up-cancel').onclick = () => { pendingBack = null; closeSheet(); };
  $('up-ok').onclick = () => {
    const r = calcUpdate(code, dia);
    if (!r){
      const f = $('up-field');
      f.style.borderColor = '#dc2626';
      setTimeout(() => { f.style.borderColor = ''; }, 900);
      return;
    }
    commitUpdate(code, dia, r);
    closeSheet();
  };
  paint();
}

/** 没颗重却想按克记 → 引导去标定，标完回到原来的录入抽屉 */
function needCalibrate(code, dia){
  const dTxt = String(dia).replace(/\.0$/,'');
  sheet(`
    <div class="sh">
      <h3>按重量记要先知道颗重</h3>
      <p>有颗重才能把克数换成颗数。测一次，${dTxt}mm 这一堆就有了。</p>
    </div>
    <div class="sb">
      <div class="prev" style="margin-top:0">
        数出 <b>${suggestSampleN(dia)} 颗</b>豆子称净重即可。包装上标了颗数的话，
        整包称重更准，还不用数。
      </div>
      <div class="lbl">现在要做什么</div>
      <div class="prev" style="margin-top:0;background:#fff">
        标定后自动回到 ${code} 的录入界面，单位已经是「克」。
      </div>
    </div>
    <div class="acts">
      <button class="btn" id="nc-later">先按颗记</button>
      <button class="btn pri" id="nc-go">去标定</button>
    </div>
  `);
  $('nc-later').onclick = () => {
    pendingBack = null; up.unit = 'pcs'; closeSheet();
    setTimeout(() => openUpdate(up.code, up.dia), 120);
  };
  $('nc-go').onclick = () => {
    const back = pendingBack;
    closeSheet();
    setTimeout(() => openCalibrate({ code, dia }, back), 200);

/**
 * 预览这次改完会变成多少。qty 永远是最终颗数。
 * 颗重（gpb）只由「重新标定」改——录克数时不再顺手反推，
 * 否则四舍五入的零头会一次次把标定值磨歪。
 */
function calcUpdate(code, dia){
  const v = up.v;
  if (v === null) return null;
  const s = statRow(code, dia);
  const gpb = s.gpb > 0 ? s.gpb : null;
  let qty, net, over = false;

  if (up.unit === 'g'){
    if (!gpb) return null;
    const base = s.net || 0;
    const after = up.op === 'set' ? v : (up.op === 'sub' ? base - v : base + v);
    over = after < 0;
    net = Math.max(0, after);
    qty = Math.round(net / gpb);
  } else {
    const base = s.qty || 0;
    const after = up.op === 'set' ? v : (up.op === 'sub' ? base - v : base + v);
    over = after < 0;
    qty = Math.max(0, Math.round(after));
    net = gpb ? qty * gpb : 0;
  }
  return { qty, net, gpb, over, delta: qty - (s.qty || 0) };
}

/**
 * 一次变动的统一说法，预览和日志共用——保证「看到什么就记什么」。
 * 顺序固定：① 变了多少颗（set 说「设为」）② 怎么算出来的 ③ 现在一共多少颗
 *   +658 颗 · 称 12.50 g ÷ 0.0190 g/颗 → 共 4,247 颗
 *   −12 颗 · 按颗 → 共 3,577 颗
 *   设为 3,947 颗 · 称 75.00 g ÷ 0.0190 g/颗（原 3,589 颗）
 * gVal：克数——add/sub 传实际增减的克（正数），set 传称出来的总量
 */
function moveText(op, unit, dQty, gVal, afterQty, beforeQty, gpb){
  const sign = dQty < 0 ? '−' : '+';
  const absQ = Math.abs(dQty);
  const core = op === 'set' ? `设为 ${intFmt(afterQty)} 颗` : `${sign}${intFmt(absQ)} 颗`;
  const how = unit === 'g'
    ? `称 ${fmt(gVal || 0)} g ÷ ${gpb ? gpb.toFixed(4) : '—'} g/颗`
    : '按颗';
  const tail = op === 'set' ? `原 ${intFmt(beforeQty)} 颗` : `共 ${intFmt(afterQty)} 颗`;
  return {
    sign, absQ, core, how, tail,
    full: op === 'set' ? `${core} · ${how}（${tail}）` : `${core} · ${how} → ${tail}`
  };
}

function commitUpdate(code, dia, r){
  const before = statRow(code, dia);
  const dQty = r.qty - (before.qty || 0);
  const dNet = (r.net || 0) - (before.net || 0);
  const gVal = up.unit !== 'g' ? null
             : (up.op === 'set' ? up.v : Math.abs(dNet));
  const mv = moveText(up.op, up.unit, dQty, gVal, r.qty, before.qty || 0, r.gpb);
  const cameFrom = (up.op === 'add' && up.sid) ? sourceOf(up.sid) : null;

  if (cameFrom && dQty > 0){
    // 入库：记流水，库存只加颗数；颗重用行里标定好的那份
    stockIn(code, dia, dQty, up.unit === 'g' ? Math.max(0, dNet) : null, up.sid, r.gpb);
    logIt(up.sid, code, 'IN', mv.full);
  } else {
    writeRow(code, dia, r.qty, r.gpb);
    logIt(null, code, up.op === 'set' ? 'SET' : (up.op === 'sub' ? 'SUB' : 'ADD'), mv.full);
  }

  save();
  curCode = code;
  openColor(); renderStock();
  if (tab === 'brand') renderBrands();
  pickedCode = code;
  renderSort();
}

/**
 * 来源只在录入时有用：记这批从哪买、什么规格、什么色。
 * 它不是库存的维度——库存只看「色号 + 直径」，同色同直径的豆子当一堆算。
 */
function sourceStat(sid){
  const rows = S.inLog.filter(x => x.sid === sid);
  let qty = 0; const codes = {};
  rows.forEach(x => { qty += x.qty || 0; codes[x.code] = 1; });
  return { qty, colors: Object.keys(codes).length, last: rows.length ? rows[0].ts : null, times: rows.length };
}

  $('b-sub').textContent = S.sources.length ? `${S.sources.length} 个来源` : '';

    </div>

      <button class="btn" id="sw-cancel">取消</button>

    openType(); renderGrid();
    if ($('p-color').classList.contains('on')) openColor();
  };
}

/* ===================== 颗重标定 ===================== */
function roughGpb(dia){
  return dia <= 3.2 ? 0.019 : (dia <= 6 ? 0.045 : 0.13);
}
function suggestSampleN(dia){ return dia <= 3.2 ? 60 : 40; }

/** 同直径最近一次测到的颗重，用来给同一堆里其他色号兜底 */
function recentGpb(dia){
  let best = null, at = 0;
  Object.keys(S.stock).forEach(k => {
    const d = Number(k.split('|')[1]);
    if (d !== Number(dia)) return;
    const it = S.stock[k];
    if (it.gpb > 0 && (it.at || 0) > at){ best = it.gpb; at = it.at || 0; }
  });
  return best;
}

/**
 * 标定的是「某色号在某直径下这一堆」的平均颗重，直接写回库存行。
 * 一个色号 + 直径只有一份标定：重新测就整份换掉，不存历史。
 * 换豆子了（颗粒粗细变了）随时可以再测，颗数不受影响，只是 ≈克数跟着变。
 */
function openCalibrate(target, back){
  const { code, dia } = target;
  const dTxt = String(dia).replace(/\.0$/,'');
  const row = statRow(code, dia);
  const prevGpb = row.gpb;                       // 这一行自己的；没有就是没标定过
  const nearGpb = prevGpb ? null : recentGpb(dia);   // 同直径别处的值，只当参考
  const defN = suggestSampleN(dia);

  // 上次量过的样本直接接着改，不用再数一遍豆子
  let calN = row.cal ? row.cal.n : defN;
  let calM = row.cal ? row.cal.m
           : (prevGpb ? Math.round(defN * prevGpb * 100) / 100 : null);

  sheet(`
    <div class="sh">
      <h3>${code} · ${dTxt}mm 的颗重</h3>
      <p>${prevGpb
        ? `现在是 <b>${prevGpb.toFixed(4)} g/颗</b>。重新称一次就整份换掉，每个色号只留最新这份。`
        : '测一次，这一堆豆子的克数就能换算成颗数了。'}</p>
    </div>
    <div class="sb">
      ${prevGpb
        ? `<div class="prev" style="margin-top:0">
             <div class="line"><span>现在的颗重</span><b>${prevGpb.toFixed(4)} g/颗</b></div>
             ${row.cal ? `<div class="line"><span>上次量的样本</span>
               <span>${dayStr(row.cal.at)} · ${intFmt(row.cal.n)} 颗 / ${fmt(row.cal.m)} g</span></div>` : ''}
             ${row.qty > 0 ? `<div class="line"><span>库存 ${intFmt(row.qty)} 颗</span>
               <span>颗数不动，只是 ≈克数会变</span></div>` : ''}
           </div>`
        : (nearGpb ? `<div class="prev" style="margin-top:0">
             同直径别处量到 <b>${nearGpb.toFixed(4)}</b> g/颗，可以拿来对照；
             但这一行还是单独测一次更准。
           </div>` : '')}
      <div class="hint">
        包装上标了颗数（如「1000 颗」）？把<b>整包称重</b>填进来，颗数填 1000——
        <b>不用数豆子，结果还更准</b>，因为完全没有数错的风险。
      </div>
      <div class="field"><label>颗数 N（数出来的，或包装标注）</label>
        <div class="numfield" id="cal-nf">
          <span class="v" id="cal-nv">${calN}</span><span class="u">颗</span>
        </div></div>
      <div class="field"><label>净重 m（克，已扣容器）</label>
        <div class="numfield" id="cal-mf">
          <span class="v${calM ? '' : ' ph'}" id="cal-mv">${calM ? fmt(calM) : '点此输入'}</span>
          <span class="u">g</span>
        </div></div>
      <div class="prev" id="cal-out">填入两项后显示结果</div>
    </div>
    <div class="acts">
      <button class="btn" id="cal-cancel">取消</button>
      <button class="btn pri" id="cal-ok">${prevGpb ? '保存新颗重' : '保存'}</button>
    </div>
  `);

  const paintN = () => {
    const el = $('cal-nv');
    el.textContent = calN > 0 ? intFmt(calN) : '点此输入';
    el.classList.toggle('ph', !(calN > 0));
  };
  const paintM = () => {
    const el = $('cal-mv');
    el.textContent = calM > 0 ? fmt(calM) : '点此输入';
    el.classList.toggle('ph', !(calM > 0));
  };

  const upd = () => {
    const out = $('cal-out');
    if (!(calN > 0) || !(calM > 0)){ out.textContent = '填入两项后显示结果'; return; }

    const w = calM / calN;
    const bag = 30;
    const cnt = bag / w;
    const errOf = p => Math.round(cnt * (p / calM));
    const e01 = errOf(0.01), e10 = errOf(0.1);
    const errTxt = n => n < 1 ? '不到 1 颗' : `±${n} 颗`;
    const pct = prevGpb ? (w - prevGpb) / prevGpb : null;
    const way = pct === null ? ''
      : Math.abs(pct) < 0.005 ? '<span class="good">和原来一样</span>'
      : `<span class="${Math.abs(pct) <= 0.15 ? 'good' : 'bad'}">`
        + `${pct > 0 ? '+' : ''}${(pct * 100).toFixed(1)}%</span>`;

    out.innerHTML = `
      颗重 <b>${w.toFixed(4)} g</b> / 颗
      ${pct === null ? '' : `<span style="color:var(--faint)">（原 ${prevGpb.toFixed(4)}）</span> ${way}`}
      ${(row.qty > 0 && prevGpb)
        ? `<br>库存 ${intFmt(row.qty)} 颗：≈${fmt(row.qty * prevGpb)} → ≈<b>${fmt(row.qty * w)}</b> g　颗数不变`
        : ''}
      <hr>
      ${bag} g 约 <b>${Math.round(cnt)}</b> 颗
      <div class="line"><span>用 0.01 g 秤</span>
        <span class="${e01 <= 20 ? 'good' : 'bad'}">${errTxt(e01)}</span></div>
      <div class="line"><span>用 0.1 g 厨房秤</span>
        <span class="${e10 <= 20 ? 'good' : 'bad'}">${errTxt(e10)}</span></div>
      ${e10 > 20 ? `<span class="w">${dia <= 3.2 ? '迷你豆' : '这个样本量'}下 0.1g 的秤不够用，误差已超出 ±20 颗预算</span>` : ''}
      ${calN < suggestSampleN(dia) ? `<br><span class="w">建议至少 ${suggestSampleN(dia)} 颗，样本太轻会让秤误差被放大</span>` : ''}
      ${(pct !== null && Math.abs(pct) > 0.15)
        ? `<br><span class="w">跟上一次差了 ${(Math.abs(pct) * 100).toFixed(0)}%，确认称的是同一个色号、同一直径——直径混了会差很多</span>` : ''}
    `;
  };

  $('cal-nf').onclick = () => numPad({
    title: `${code} · ${dTxt}mm　样本颗数`, unit: '颗', decimal: false, value: calN,
    onOk: v => { calN = Math.round(v); paintN(); upd(); }
  });
  $('cal-mf').onclick = () => numPad({
    title: `${code} · ${dTxt}mm　样本净重（已扣容器）`, unit: 'g', decimal: true,
    value: calM, onOk: v => { calM = v; paintM(); upd(); }
  });

  paintN(); paintM(); upd();

  // 取消＝放弃这次标定，但不要连带把用户的录入也丢了
  $('cal-cancel').onclick = () => {
    pendingBack = null;
    closeSheet();
    if (back && back.code) setTimeout(() => openUpdate(back.code, back.dia, back), 180);
  };
  $('cal-ok').onclick = () => {
    if (!(calN > 0) || !(calM > 0)){
      const bad = !(calN > 0) ? $('cal-nf') : $('cal-mf');
      bad.style.borderColor = '#dc2626';
      setTimeout(() => { bad.style.borderColor = ''; }, 900);
      return;
    }
    const w = calM / calN;
    const cur = statRow(code, dia);
    writeRow(code, dia, cur.qty, w);
    // 只留最新这一份样本，下次打开接着改，不算历史
    S.stock[diaKey(code, dia)].cal = { n: calN, m: calM, at: Date.now() };
    logIt(null, code, 'CALIBRATE',
      `${dTxt}mm 颗重 ${w.toFixed(4)} g/颗${prevGpb ? `（原 ${prevGpb.toFixed(4)}）` : ''}`
      + `（${calN} 颗 ${fmt(calM)} g）`);
    save(); closeSheet();
    renderBrands(); renderStock();
    if ($('p-color').classList.contains('on')) openColor();
    // 从录入抽屉过来的，标定完原路回去，已经填的数量还在
    if (back) setTimeout(() => openUpdate(back.code, back.dia, back), 220);
    pendingBack = null;
  };
}
